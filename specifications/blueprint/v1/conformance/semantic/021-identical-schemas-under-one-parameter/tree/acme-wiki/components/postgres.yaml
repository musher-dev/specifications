# The same schema, written differently. `sensitive` comes first here and second
# in `api.yaml`, so a comparison of the blocks as written calls these different.
# By the test BP-PARAM-002 states, they are the same.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      adminPassword:
        schema:
          sensitive: true
          type: STRING
        required: false
        description: Superuser password for the database cluster.
    outputs: {}
