specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      databasePort:
        schema:
          type: string
        description: Port the database listens on.
        target:
          envVarKey: DATABASE_PORT
    outputs: {}
