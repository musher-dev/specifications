specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  external: {}
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs: {}
    outputs:
      baseUrl:
        description: Base URL of the addressed service, for a consumer to call.
        schema:
          type: string
        source:
          type: LITERAL
          value: https://api.example.com/v1
