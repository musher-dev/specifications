specVersion: v1
kind: BLUEPRINT
metadata:
  slug: mutual-discovery
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      bindings:
        webUrl:
          type: OUTPUT
          node: web
          output: publicUrl
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        apiUrl:
          type: OUTPUT
          node: api
          output: privateAddress
  parameters: {}
