# The platform mints `signingKey`, and the input receiving it never says the
# value is secret: `sensitive` defaults to false, so the component would echo
# the minted key into logs and interfaces like any other setting. A generated
# value is secret material, and the component is the one document that says how
# a value is handled, so a generator may only cover inputs that already say so.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
  parameters:
    signingKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Signing key
