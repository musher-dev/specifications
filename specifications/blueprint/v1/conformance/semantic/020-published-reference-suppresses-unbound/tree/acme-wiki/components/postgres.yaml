specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      siteTitle:
        schema:
          type: string
        required: false
        description: Title the application shows in its header.
        default: Acme Wiki
        target:
          envVarKey: SITE_TITLE
    outputs: {}
