specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs: {}
    outputs:
      connectionString:
        schema:
          type: string
        description: Connection string a client uses to reach this database.
        sensitive: true
        presentationHint: CONNECTION_STRING
        from:
          endpoint: primary
          property: privateAddress
