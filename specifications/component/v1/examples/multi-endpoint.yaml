# yaml-language-server: $schema=https://specifications.musher.dev/component/v1/component.schema.json
#
# A service fronting two public URLs, one public TCP port, and one private
# port. Because more than one endpoint is PUBLIC, nothing here may say "the
# component's URL" — every reference names the endpoint it means.
#
# Both of §5.2's address forms are published. `console` publishes a URL.
# `wire` is a PUBLIC TCP endpoint published at a host:port edge address, which
# compels no readiness probe. The component only declares that it needs both
# addresses; a blueprint decides where they come from, and may derive them from
# these endpoints with a platform default (blueprint §5.2).
#
# `telemetry` is a STRING_LIST: its string form is a JSON array of members of
# `enum`, so its default is that array's text.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
      console:
        containerPort: 8081
        protocol: HTTP
        visibility: PUBLIC
      wire:
        containerPort: 5671
        protocol: TCP
        visibility: PUBLIC
      metrics:
        containerPort: 9090
        protocol: HTTP
        visibility: PRIVATE
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      consoleUrl:
        description: Public URL the admin console is served at.
        schema:
          type: STRING
        target:
          envVarKey: CONSOLE_URL
      wireAddress:
        description: Edge address clients use to reach the wire protocol.
        schema:
          type: STRING
        target:
          envVarKey: WIRE_ADDRESS
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: STRING_LIST
          enum:
            - logs
            - metrics
            - traces
          default: '["logs","metrics"]'
        required: false
        target:
          envVarKey: TELEMETRY_EXPORTERS
    outputs: {}
