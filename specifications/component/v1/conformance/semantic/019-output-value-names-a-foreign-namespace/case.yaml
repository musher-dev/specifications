# `config` is reserved by core §5.2 and given no meaning in these documents, so
# no family admits it. An output value names this node's own addressing or
# nothing: a value reaching outside the node would depend on something the
# component cannot see, which is the invariant §6.2 rests on.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: web
  contract:
    inputs: {}
    outputs:
      baseUrl:
        description: Address this service answers on.
        valueFrom: DECLARED
        value: "${{ config.baseUrl }}"
        schema:
          type: STRING
