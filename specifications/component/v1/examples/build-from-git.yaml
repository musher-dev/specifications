specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: GIT
      repositoryURL: https://github.com/musher-dev/examples
      ref:
        type: BRANCH
        name: main
      build:
        strategy: DOCKERFILE
        dockerfilePath: Dockerfile
        arguments:
          NODE_ENV: production
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: web
        periodSeconds: 10
        failureThreshold: 3
        type: HTTP
