specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      heapMax:
        description: Synthetic fixture input.
        schema:
          type: string
        target:
          envVar: NEO4J_server_memory_heap_max__size
        default: 512m
