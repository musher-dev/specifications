specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      replicas:
        schema:
          type: array
          items:
            type: string
            enum:
              - primary
              - replica
          uniqueItems: true
        description: Which database replicas the application reads from.
        target:
          envVarKey: REPLICAS
    outputs: {}
