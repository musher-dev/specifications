specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      db:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      databaseUrl:
        schema:
          type: string
        description: Connection URL clients outside the item use to reach the database.
        target:
          envVarKey: DATABASE_URL
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        from:
          template: "${{ self.endpoints.db.publicUrl }}"
