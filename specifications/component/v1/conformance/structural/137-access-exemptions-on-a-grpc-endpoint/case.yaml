specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
      rpc:
        targetPort: 9090
        protocol: GRPC
        accessExemptions:
          bearer: true
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs: {}
    outputs: {}
