specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings:
        backend:
          type: PARAMETER
          parameter: backend
        hostname:
          type: PARAMETER
          parameter: hostname
  parameters:
    backend:
      ui:
        label: Storage backend
        order: 1
        enumLabels:
          S3: Amazon S3
          GCS: Google Cloud Storage
    hostname:
      ui:
        label: Public hostname
        order: 2
        prominence: SECONDARY
        examples:
          - wiki.example.com
