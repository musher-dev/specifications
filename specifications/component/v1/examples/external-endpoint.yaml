specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Managed PostgreSQL database run by a provider outside this platform and addressed by its host.
spec:
  type: EXTERNAL
  contract:
    inputs:
      host:
        description: Hostname of the managed database server.
        schema:
          type: string
        presentationHint: HOSTNAME
      port:
        description: Port the managed database server listens on.
        schema:
          type: integer
          minimum: 1
          maximum: 65535
        default: 5432
      database:
        description: Name of the database the application uses.
        schema:
          type: string
      username:
        description: Role the application connects as.
        schema:
          type: string
      password:
        description: Password of the application role.
        schema:
          type: string
        sensitive: true
    outputs:
      host:
        description: Hostname of the managed database server, for a client to connect to.
        schema:
          type: string
        presentationHint: HOSTNAME
        from:
          input: host
      port:
        description: Port the managed database server listens on.
        schema:
          type: integer
        from:
          input: port
      database:
        description: Name of the database the application uses.
        schema:
          type: string
        from:
          input: database
      username:
        description: Role the application connects as.
        schema:
          type: string
        from:
          input: username
      password:
        description: Password of the application role.
        schema:
          type: string
        sensitive: true
        from:
          input: password
      sslMode:
        description: TLS mode a client uses; the provider accepts only verified connections.
        schema:
          type: string
        from:
          value: verify-full
