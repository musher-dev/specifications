specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: GIT
      repositoryURL: https://github.com/acme/web.git
      build:
        strategy: DOCKERFILE
        dockerfilePath: Dockerfile
        arguments:
          node-version: "22"
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
