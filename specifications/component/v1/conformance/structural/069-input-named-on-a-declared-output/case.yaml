specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      siteTitle:
        description: Title shown in the site header.
        schema:
          type: string
        target:
          envVarKey: SITE_TITLE
    outputs:
      siteTitle:
        description: Title shown in the site header, for a sibling that renders it.
        schema:
          type: string
        source:
          type: LITERAL
          value: My Application
          input: forbidden
