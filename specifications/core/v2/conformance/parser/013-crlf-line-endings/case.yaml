# Every line here ends CRLF. A repository checked out on Windows with
# core.autocrlf=true produces exactly this, and the document means the same
# thing it would with LF.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Static web server.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
