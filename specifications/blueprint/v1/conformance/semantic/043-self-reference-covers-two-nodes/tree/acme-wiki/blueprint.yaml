# One field shows one value, and two nodes have two addresses. Nothing in the
# document says which the deploying user would be shown, so it is rejected
# rather than picked. `toNode` is how an author says which node they meant.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    app:
      componentRef: ./components/app.yaml
      size: general.standard.small
      connections: {}
    edge:
      componentRef: ./components/edge.yaml
      size: general.standard.small
      connections: {}
  parameters:
    brokerAddress:
      default: "${{ self.publicAddress }}"
      ui:
        label: Broker address
