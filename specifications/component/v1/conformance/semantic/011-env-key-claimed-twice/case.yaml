specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      db:
        containerPort: 5432
        protocol: TCP
    envVars:
      - key: DATABASE_URL
        value:
          type: LITERAL
          value: postgres://localhost/app
  contract:
    inputs:
      databaseUrl:
        description: Connection URL of the database the service reads and writes.
        schema:
          type: string
        target:
          envVarKey: DATABASE_URL
