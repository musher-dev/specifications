specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Background worker that answers queued requests with a language model it reaches through three ordinary inputs.
spec:
  type: WORKER
  workload:
    source:
      image: ghcr.io/musher-dev/assistant-worker:2.3.0
  contract:
    inputs:
      llmBaseURL:
        description: Base URL of the language-model API.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVar: OPENAI_BASE_URL
      llmAPIKey:
        description: Credential presented to the language-model API.
        schema:
          type: string
        sensitive: true
        target:
          envVar: OPENAI_API_KEY
      llmModel:
        description: Model the language-model API answers with.
        schema:
          type: string
        target:
          envVar: OPENAI_MODEL
    outputs: {}
