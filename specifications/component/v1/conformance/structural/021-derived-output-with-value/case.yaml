specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
  contract:
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: string
        source:
          type: ENDPOINT
          endpoint: web
          property: privateAddress
          value: forbidden
