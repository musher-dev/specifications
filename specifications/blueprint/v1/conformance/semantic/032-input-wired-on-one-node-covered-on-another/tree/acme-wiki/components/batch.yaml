specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: WORKER
    source:
      type: IMAGE
      ref: ghcr.io/example/batch:2.0.1
  contract:
    inputs:
      apiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        target:
          envVarKey: OPENAI_API_KEY
        description: Credential the batch worker presents to the chat-completions service.
    outputs: {}
