specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    adminPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
      ui:
        label: Administrator password
  components:
    api:
      componentRef: ./components/api.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings:
        adminPassword:
          parameter: adminPassword
    db:
      componentRef: ./components/postgres.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings:
        adminPassword:
          parameter: adminPassword
