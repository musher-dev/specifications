# `valueFrom: INPUT` is not external-only, and this pins that. A workload that
# republishes a value it was given is useful and harmless: so long as no wire
# fills the input, which blueprint §4.2 enforces, the value resolves before any
# edge is bound, and §6.2's invariant holds here as it does for an external
# component.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      siteTitle:
        description: Title shown in the site header.
        schema:
          type: STRING
    outputs:
      siteTitle:
        description: Title shown in the site header, for a sibling that renders it.
        schema:
          type: STRING
        valueFrom: INPUT
        input: siteTitle
