specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings:
        backend:
          type: PARAMETER
          parameter: backend
      exposure:
        primary: PRIVATE
      volumes: {}
  parameters:
    backend:
      ui:
        label: Storage backend
        enumLabels:
          S3: Amazon S3
          AZUR: Azure Blob Storage
