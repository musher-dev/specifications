specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      lower:
        description: Synthetic fixture input.
        schema:
          type: string
        default: a
        target:
          envVar: foo
      upper:
        description: Synthetic fixture input.
        schema:
          type: string
        default: b
        target:
          envVar: FOO
