specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    outputs:
      url:
        description: Address a client reaches the database at.
        schema:
          type: string
        from:
          template: "${{ self.endpoints.primary.publicUrl }}/"
