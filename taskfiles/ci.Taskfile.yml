# CI: the two entry points .github/workflows/validate.yml calls, `ci:lint` and
# `ci:test`.
#
# They exist so the workflow names one task per job rather than a list of
# checks: a check added to a job is added here, where a developer can run the
# same job locally, instead of only in YAML nobody executes before pushing.
#
# `task check` runs everything; these two are its split into the Tools / Lint
# and Specifications / Schema jobs. Every check in either must also be in `check`. Like `check`,
# each runs its checks as parallel deps. The one exception to one task per job:
# Specifications / Schema also names `contracts:check contracts:breaking` on its
# command line, which is where the conventions look for them (IFACE-12).
#
# Every fragment is included flattened (TASK-20), so a reference such as
# `task: check:format` names the task exactly as its fragment writes it.
version: '3'

tasks:
  ci:lint:
    desc: Lint suite as run in CI
    deps:
      - task: check:format
      - task: check:config
      - task: check:rulesets
      - task: check:commits
      - task: check:docs
      - task: check:links
      - task: check:adr
      - task: check:md
      - task: check:spelling
      - task: check:prose
      - task: check:shell
      - task: check:workflow

  # The interface checks, check:schema, check:generated, check:examples and
  # check:compat, run in the same job as `task contracts:check
  # contracts:breaking`, the names the conventions look for (IFACE-12).
  ci:test:
    desc: Schema and conformance suite as run in CI, beside contracts:check and contracts:breaking
    deps:
      - task: check:conformance
      - task: check:standards
      - task: check:parity
      - task: check:editions
      - task: check:test
