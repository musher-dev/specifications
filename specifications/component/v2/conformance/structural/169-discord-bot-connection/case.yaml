specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: EXTERNAL
  contract:
    inputs:
      discord:
        description: Connection this node stands for
        connection:
          protocol: DISCORD_BOT
    outputs:
      baseURL:
        description: Forwarded baseURL
        schema:
          type: string
        from:
          input: discord
          member: baseURL
      botToken:
        description: Forwarded botToken
        schema:
          type: string
        sensitive: true
        from:
          input: discord
          member: botToken
      applicationID:
        description: Forwarded applicationID
        schema:
          type: string
        from:
          input: discord
          member: applicationID
      publicKey:
        description: Forwarded publicKey
        schema:
          type: string
        from:
          input: discord
          member: publicKey
