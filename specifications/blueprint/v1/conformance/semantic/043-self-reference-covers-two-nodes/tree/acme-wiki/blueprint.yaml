specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    app:
      componentRef: ./components/app.yaml
      size: general.standard.small
      bindings:
        brokerAddress:
          type: OUTPUT
          node: app
          output: installDefault
      exposure:
        amqp: PUBLIC
        metrics: PRIVATE
      volumes: {}
    edge:
      componentRef: ./components/edge.yaml
      size: general.standard.small
      bindings:
        brokerAddress:
          type: OUTPUT
          node: edge
          output: installDefault
      exposure:
        amqp: PUBLIC
        metrics: PRIVATE
      volumes: {}
