specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs:
      header:
        description: Synthetic input.
        schema: { type: string }
        target: { envVarKey: EMAIL_HEADER }
    outputs:
      emailHeader:
        description: Synthetic output.
        schema: { type: string }
        from: { endpoint: web, property: viewerEmailHeader }
