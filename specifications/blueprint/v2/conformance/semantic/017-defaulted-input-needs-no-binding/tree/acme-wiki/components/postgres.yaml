specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      databaseName:
        schema:
          type: string
        description: Name of the database created on first start.
        default: app
        target:
          envVar: DATABASE_NAME
    outputs: {}
