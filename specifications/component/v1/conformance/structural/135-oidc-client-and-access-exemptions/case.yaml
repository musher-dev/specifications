specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
        oidc:
          redirectPaths: [/oauth/oidc/callback, /login/generic_oauth]
        accessExemptions:
          paths: [/webhook, /webhook-test, "/api/v1/runs:start", /.musherx]
          bearer: true
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs: {}
    outputs: {}
