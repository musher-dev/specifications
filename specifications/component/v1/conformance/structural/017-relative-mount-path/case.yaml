specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    volumes:
      data:
        mountPath: var/lib/postgresql/data
        minimumSizeGiB: 10
