specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      DATABASE_URL:
        description: Connection URL of the database the service reads and writes.
        schema:
          type: string
        target:
          envVarKey: _D_A_T_A_B_A_S_E__U_R_L
    outputs: {}
