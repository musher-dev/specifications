specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      systemPrompt:
        description: System prompt prepended to every conversation.
        schema:
          type: string
        presentationHint: MULTILINE
        target:
          envVarKey: SYSTEM_PROMPT
    outputs: {}
