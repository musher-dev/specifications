specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      api:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: api
          path: /healthz
  contract:
    inputs:
      apiAddress:
        schema:
          type: string
        description: Edge address of the API.
        target:
          envVarKey: API_ADDRESS
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        from:
          template: "${{ self.endpoints.api.publicAddress }}"
