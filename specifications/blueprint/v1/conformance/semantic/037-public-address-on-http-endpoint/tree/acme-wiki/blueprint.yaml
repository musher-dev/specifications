# The mirror of semantic-036. PUBLIC_ADDRESS derives the host:port a TCP or UDP
# endpoint publishes on an allocated edge port; an HTTP-family endpoint is
# published through the shared ingress as a URL, so there is no such port to
# name.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    app:
      componentRef: ./components/app.yaml
      size: general.standard.small
      connections: {}
  parameters:
    apiAddress:
      default: "${{ self.publicAddress.api }}"
      ui:
        label: API address
