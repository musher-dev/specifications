{
  "specVersion": "v1",
  "kind": "COMPONENT",
  "metadata": {
    "revision": 1,
    "description": "Synthetic conformance fixture component."
  },
  "spec": {
    "type": "WORKER",
    "workload": {
      "source": {
        "image": "example/worker:1"
      }
    },
    "contract": {
      "inputs": {
        "url": {
          "description": "Connection input",
          "schema": {
            "type": "string"
          },
          "sensitive": false,
          "target": {
            "envVarKey": "URL"
          }
        },
        "key": {
          "description": "Connection input",
          "schema": {
            "type": "string"
          },
          "sensitive": true,
          "target": {
            "envVarKey": "KEY"
          }
        },
        "model": {
          "description": "Connection input",
          "schema": {
            "type": "string"
          },
          "sensitive": false,
          "target": {
            "envVarKey": "MODEL"
          }
        }
      },
      "outputs": {},
      "connectionRequirements": {
        "llm": {
          "protocol": "OPENAI",
          "capabilities": [
            "STREAMING",
            "TOOL_CALLS"
          ],
          "inputs": {
            "baseUrl": "url",
            "apiKey": "key",
            "model": "model"
          }
        }
      }
    }
  }
}
