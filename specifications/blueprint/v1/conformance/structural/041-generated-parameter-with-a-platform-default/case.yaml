# Minting a value and deriving one are two answers to the same question, and
# nothing would say which arrives. The exclusion is a shape, so it is decided
# here without reading any component.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections: {}
  parameters:
    secretKey:
      generator:
        byteLength: 32
        encoding: HEX
      platformDefault:
        type: SELF_ADDRESS
        source: PUBLIC_URL
      ui:
        label: Secret key
