specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      apiToken:
        description: Bearer token the service accepts on its API.
        schema:
          type: string
        target:
          envVarKey: API_TOKEN
        sensitive: true
    outputs:
      apiToken:
        description: The bearer token this service accepts, for a client that calls it.
        schema:
          type: string
        sensitive: true
        source:
          type: INPUT
          input: apiToken
