specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    models:
      componentRef: ./components/models.yaml
      size: null
      bindings:
        baseUrl:
          type: PARAMETER
          parameter: baseUrl
        apiKey:
          type: PARAMETER
          parameter: apiKey
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        llmBaseUrl:
          type: OUTPUT
          node: models
          output: baseUrl
        llmApiKey:
          type: OUTPUT
          node: models
          output: apiKey
      exposure:
        web: PUBLIC
      volumes: {}
  parameters:
    baseUrl:
      ui:
        label: API base URL
        order: 1
    apiKey:
      ui:
        label: API key
        order: 2
