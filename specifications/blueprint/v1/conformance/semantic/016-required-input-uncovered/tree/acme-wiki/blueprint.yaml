specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      bindings:
        siteTitle:
          type: PARAMETER
          parameter: siteTitle
      exposure:
        primary: PRIVATE
      volumes: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings: {}
      exposure:
        primary: PRIVATE
      volumes: {}
  parameters:
    siteTitle:
      ui:
        label: Site title
