name: Validate Pull Request

# Owns the checks of the pull request itself rather than of the tree: its
# title, which becomes the squash commit release-please reads, and the
# Developer Certificate of Origin sign-off on every commit it carries. The
# author reads a red job here. The one context the ruleset requires is
# `Validate Pull Request / Required`.
#
# It is a workflow of its own because it must re-run when a title is `edited`:
# in validate.yml that event would re-run, or through the concurrency group
# cancel, every other job (docs/adr/0036 §5).
#
# `merge_group` is declared so a merge queue sees the context. A merge group has
# no pull request, so both checks skip there and the aggregate passes on skips.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: Title / Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          install-args: aqua:oven-sh/bun aqua:go-task/task

      # Held to .github/conventional-commits.yaml by the same task a developer
      # runs. The title reaches the shell through the environment, never
      # through ${{ }} interpolation into the script: it is attacker-chosen.
      - name: Check the title against the commit vocabulary
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: task check:title

  # The reasoning, including the one exception for a GitHub App's sign-off, is
  # docs/adr/0016-dependency-update-policy.md; this is a paper trail, not a
  # security control.
  sign_off:
    name: Commits / Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit carries a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0

          # --no-merges: a merge commit is not authored content, and requiring a
          # trailer on one would fail every branch that has been brought up to
          # date rather than rebased.
          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          for sha in $commits; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            name="$(git show -s --format='%an' "$sha")"
            email="$(git show -s --format='%ae' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            # Trailers only — a "Signed-off-by" written into the body is not a
            # sign-off, and %(trailers) is what git itself considers one.
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"

            # A GitHub App: both halves of the identity must say so, and the
            # trailer still has to name the same author. Only the address is
            # allowed to differ, because only the address is out of its hands.
            case "$name" in *'[bot]') bot=1 ;; *) bot=0 ;; esac
            case "$email" in *'[bot]@users.noreply.github.com') ;; *) bot=0 ;; esac

            if printf '%s\n' "$trailers" | grep -qxF "$author"; then
              echo "  ✓ ${sha:0:8} ${subject}"
            elif [ "$bot" -eq 1 ] \
                 && printf '%s\n' "$trailers" | sed -E 's/ *<[^>]*>$//' | grep -qxF "$name"; then
              echo "  ✓ ${sha:0:8} ${subject} — app sign-off by ${name}"
            else
              echo "::error::${sha:0:8} (${subject}) has no Signed-off-by matching its author ${author}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat >&2 <<'MSG'

          Every commit must carry a Developer Certificate of Origin sign-off
          whose name and email match the commit author:

              git commit -s

          To fix commits already pushed:

              branch="$(git branch --show-current)"
              pushed="$(git rev-parse "origin/$branch")"
              git rebase --signoff origin/main
              git push --force-with-lease="$branch:$pushed" origin "$branch"

          See .github/CONTRIBUTING.md → Sign your work.
          MSG
            exit 1
          fi

  required:
    name: Validate Pull Request / Required
    if: always()
    needs:
      - title
      - sign_off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Success passes. A skip passes only in a merge group, where there is no
      # pull request to judge; anywhere else a skipped check has proved nothing.
      - name: Classify every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed=0
          while read -r job result; do
            printf '%-10s %s\n' "$job" "$result"
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$EVENT" = "merge_group" ]; then continue; fi
            echo "::error title=Validate Pull Request / Required::job '$job' reported '$result'"
            failed=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$RESULTS")
          exit "$failed"
