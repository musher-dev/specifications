specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      api:
        targetPort: 8080
        protocol: HTTP
      console:
        targetPort: 8081
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: api
          path: /healthz
  contract:
    inputs:
      consoleUrl:
        description: Public URL the admin console is served at.
        schema:
          type: string
        target:
          envVarKey: CONSOLE_URL
    outputs: {}
