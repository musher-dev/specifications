specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  external: {}
  contract:
    inputs:
      baseUrl:
        description: Base URL of the service this node addresses.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
      apiKey:
        description: Bearer credential presented to the service above.
        schema:
          type: string
        sensitive: true
      model:
        description: Name the service uses to select what answers.
        schema:
          type: string
        required: false
    outputs:
      baseUrl:
        description: Base URL of the addressed service, for a consumer to call.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        source:
          type: INPUT
          input: baseUrl
      apiKey:
        description: Bearer credential for the addressed service.
        schema:
          type: string
        sensitive: true
        source:
          type: INPUT
          input: apiKey
      model:
        description: Model name the addressed service answers with.
        schema:
          type: string
        source:
          type: INPUT
          input: model
