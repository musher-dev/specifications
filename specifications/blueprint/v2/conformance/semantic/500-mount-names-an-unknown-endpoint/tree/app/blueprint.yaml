specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  nodes:
    app:
      componentRef: ./components/app.yaml
      compute:
        profile: general.standard.small
      exposure:
        web:
          visibility: PUBLIC
          access: RESTRICTED
    realtime:
      componentRef: ./components/realtime.yaml
      compute:
        profile: general.standard.small
      exposure:
        socket:
          visibility: PUBLIC
          access: RESTRICTED
          mount:
            node: app
            endpoint: api
            path: /socket.io
