specVersion: v1
kind: BLUEPRINT
metadata:
  slug: mutual-discovery
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  components:
    api:
      componentRef: ./components/api.yaml
      compute:
        profile: general.standard.small
      bindings:
        webUrl:
          node: web
          output: publicUrl
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      bindings:
        apiUrl:
          node: api
          output: privateAddress
