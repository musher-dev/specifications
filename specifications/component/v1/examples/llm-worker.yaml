specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: WORKER
    source:
      type: IMAGE
      ref: example/llm-worker:1.0.0
  contract:
    inputs:
      llmBaseUrl:
        description: Base URL of the model API.
        schema:
          type: string
          minLength: 1
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: LLM_BASE_URL
      llmApiKey:
        description: Credential for the model API.
        schema:
          type: string
          minLength: 1
        sensitive: true
        target:
          envVarKey: LLM_API_KEY
    outputs: {}
