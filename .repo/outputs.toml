# What this repository publishes (EC-0007 in musher-dev/engineering-conventions)
# and the interfaces those outputs deliver (EC-0030). `conventions check` reads
# this file at this fixed path.
#
# Each family's release archive is a bundle that release.yml attaches to the
# family's immutable GitHub Release (docs/adr/0023 §2). The site serves every
# released schema at its `$id` URL, and deploy.yml is what publishes it. Each
# kind family's schema is an interface, delivered by its family's bundle, which
# carries the release record listing it (docs/adr/0037). Each family's
# registries are a data interface its bundle delivers, and core's bundle also
# delivers the schemas they are valid against (docs/adr/0043).
schema_version = 2

[[outputs]]
id = "core-release"
kind = "bundle"
description = "The core specification's release archive: prose, parser-phase corpus, registries and interface schemas."
source = "specifications/core/v2/"
publish_workflow = "release.yml"
location = "https://github.com/musher-dev/specifications/releases"
docs = "docs/publication.md#release-assets"

[[outputs]]
id = "component-release"
kind = "bundle"
description = "The component family's release archive: prose, schema, examples, corpus and registries."
source = "specifications/component/v2/"
publish_workflow = "release.yml"
location = "https://github.com/musher-dev/specifications/releases"
docs = "docs/publication.md#release-assets"

[[outputs]]
id = "blueprint-release"
kind = "bundle"
description = "The blueprint family's release archive: prose, schema, examples, corpus and registries."
source = "specifications/blueprint/v2/"
publish_workflow = "release.yml"
location = "https://github.com/musher-dev/specifications/releases"
docs = "docs/publication.md#release-assets"

[[outputs]]
id = "listing-release"
kind = "bundle"
description = "The listing family's release archive: prose, schema, examples, corpus and registries."
source = "specifications/listing/v2/"
publish_workflow = "release.yml"
location = "https://github.com/musher-dev/specifications/releases"
docs = "docs/publication.md#release-assets"

[[outputs]]
id = "site"
kind = "site"
description = "specifications.musher.dev: every released schema at its $id URL, with the prose and the catalog."
source = "specifications/"
publish_workflow = "deploy.yml"
location = "https://specifications.musher.dev"
docs = "docs/using-schemas.md#which-url"

# gated, not versioned: a break needs a new specifications/<family>/v<N>/
# directory, which is a new major release, and check:compat fails one inside a
# major (docs/adr/0005). The major is in the directory, not the file name.
[[interfaces]]
id = "component-schema"
format = "json-schema"
description = "The component document's JSON Schema, for validators and editors."
definitions = ["specifications/component/v2/schemas/src/"]
delivered_by = "component-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#which-url"

[[interfaces]]
id = "blueprint-schema"
format = "json-schema"
description = "The blueprint document's JSON Schema, for validators and editors."
definitions = ["specifications/blueprint/v2/schemas/src/"]
delivered_by = "blueprint-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#which-url"

[[interfaces]]
id = "listing-schema"
format = "json-schema"
description = "The listing document's JSON Schema, for validators and editors."
definitions = ["specifications/listing/v2/schemas/src/"]
delivered_by = "listing-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#which-url"

# The validation result (docs/adr/0044): what one validation reports, the
# shape the platform, the CLI and every SDK return, and the subset a
# conformance fixture declares. Authored, not generated.
[[interfaces]]
id = "core-validation-result"
format = "json-schema"
description = "The JSON Schema of a validation result and its diagnostics, for every implementation that reports one."
definitions = ["specifications/core/v2/interfaces/validation-result.schema.json"]
delivered_by = "core-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#registries"

# The registries (docs/adr/0043). Each is a committed projection `task docs`
# writes from spec.md and docs/terminology.yaml, so `generated`: check:docs is
# its drift check and check:compat:registry its breaking-change check. spec.md
# stays normative for every requirement ID and code.
[[interfaces]]
id = "core-registry-schemas"
format = "json-schema"
description = "The JSON Schemas of the registries and the term records, for every consumer that reads them."
definitions = ["specifications/core/v2/interfaces/registry/"]
delivered_by = "core-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "core-registry"
format = "data"
description = "Core's requirement IDs, diagnostic codes, ordered lists and every term record, as JSON."
definitions = ["specifications/core/v2/registry/"]
delivered_by = "core-release"
compatibility = "gated"
audience = "public"
generated = true
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "component-registry"
format = "data"
description = "The component family's requirement IDs and every diagnostic code its documents may report, as JSON."
definitions = ["specifications/component/v2/registry/"]
delivered_by = "component-release"
compatibility = "gated"
audience = "public"
generated = true
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "blueprint-registry"
format = "data"
description = "The blueprint family's requirement IDs and every diagnostic code its documents may report, as JSON."
definitions = ["specifications/blueprint/v2/registry/"]
delivered_by = "blueprint-release"
compatibility = "gated"
audience = "public"
generated = true
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "listing-registry"
format = "data"
description = "The listing family's requirement IDs and every diagnostic code its documents may report, as JSON."
definitions = ["specifications/listing/v2/registry/"]
delivered_by = "listing-release"
compatibility = "gated"
audience = "public"
generated = true
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "component-protocols"
format = "data"
description = "The connection protocol registry: one JSON record per protocol, with its members, their types, presence, defaults, sensitivity and roles, and the protocol categories."
definitions = ["specifications/component/v2/protocols/"]
delivered_by = "component-release"
compatibility = "gated"
audience = "public"
docs = "docs/using-schemas.md#registries"

[[interfaces]]
id = "blueprint-connection-evidence"
format = "json-schema"
description = "The JSON Schema of the connection evidence a resolver records for each connection selection."
definitions = ["specifications/blueprint/v2/interfaces/connection-evidence.schema.json"]
delivered_by = "blueprint-release"
compatibility = "gated"
audience = "public"
generated = true
docs = "docs/using-schemas.md#registries"
