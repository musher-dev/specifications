specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      port:
        description: Port the service listens on.
        schema:
          type: integer
          minimum: 1
          maximum: 65535
        target:
          envVarKey: PORT
    outputs:
      port:
        description: Port the service listens on, for a consumer to connect to.
        schema:
          type: number
        from:
          value: 5432
