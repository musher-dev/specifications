# A platform default rides on the parameter, because deriving a value from a
# node's own addressing is a way of supplying it and supply is the blueprint's
# to decide. The field still reaches the form: the platform fills it and the
# deploying user may type over it. Which endpoint it resolves against, on each
# node the parameter covers, is §5.2's semantic question and not this case's.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    publicUrl:
      platformDefault:
        type: SELF_ADDRESS
        source: PUBLIC_URL
      ui:
        label: Public URL
        prominence: SECONDARY
