specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Web application built with a Dockerfile from a tagged release of its Git repository.
spec:
  type: SERVICE
  workload:
    source:
      git:
        repositoryURL: https://github.com/musher-dev/examples
        ref:
          tag: v1.2.0
    build:
      dockerfile: Dockerfile
      arguments:
        NODE_ENV: production
    command:
      - node
      - server.js
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
        periodSeconds: 10
        failureThreshold: 3
