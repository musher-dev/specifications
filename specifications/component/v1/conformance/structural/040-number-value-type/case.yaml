specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      port:
        description: Port the service listens on.
        schema:
          type: integer
          minimum: 1
          maximum: 65535
        target:
          envVarKey: PORT
    outputs:
      port:
        description: Port the service listens on, for a consumer to connect to.
        schema:
          type: number
        source:
          type: LITERAL
          value: 5432
