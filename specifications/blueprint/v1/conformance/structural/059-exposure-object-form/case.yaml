specVersion: v1
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  components:
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      exposure:
        web:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: HEADER
        admin:
          visibility: PRIVATE
        docs:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: NONE
        status:
          visibility: PUBLIC
          access: OPEN
