specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      systemPrompt:
        description: System prompt prepended to every conversation.
        schema:
          type: string
        presentationHint: MULTILINE
        target:
          envVarKey: SYSTEM_PROMPT
    outputs: {}
