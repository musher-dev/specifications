specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  external: {}
  contract:
    inputs:
      baseUrl:
        schema:
          type: string
        description: Base URL of the service this node addresses.
        presentationHint: ENDPOINT_URL
      apiKey:
        schema:
          type: string
        description: Bearer credential presented to the service.
        sensitive: true
    outputs:
      baseUrl:
        schema:
          type: string
        description: Base URL of the service this node addresses.
        presentationHint: ENDPOINT_URL
        source:
          type: INPUT
          input: baseUrl
      apiKey:
        schema:
          type: string
        description: Bearer credential presented to the service.
        sensitive: true
        source:
          type: INPUT
          input: apiKey
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        source:
          type: TEMPLATE
          template: ${{ self.publicUrl }}
