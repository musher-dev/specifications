# One parameter covers `adminPassword` on both nodes, and the two components
# disagree about what it is: a STRING for `api`, a NUMBER for `db`. The form has
# one field to render and one value to hand to both, so there is no shape it
# could honestly take. The author's remedy is two differently keyed inputs, or
# components that agree.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    adminPassword:
      ui:
        label: Administrator password
