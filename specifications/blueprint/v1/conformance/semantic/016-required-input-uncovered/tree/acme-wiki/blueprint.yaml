# `db` requires an `adminPassword`, and its schema carries no default. The form
# covers `siteTitle` and stops there, so no field asks for the password, no
# generator mints it and no `self` reference reads it. The workload would
# start without it.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    siteTitle:
      ui:
        label: Site title
