# `kind` names a different family. Each family's schema constrains kind to
# its own constant, so a document cannot be validated by the wrong schema.
specVersion: v1
kind: LISTING
metadata:
  slug: postgres
  revision: 1
  description: A PostgreSQL database.
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      compute:
        profile: general.standard.small
  parameters: {}
