specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      endpoints:
        description: Endpoints the service publishes.
        schema:
          type: array
          items:
            type: string
            enum:
              - primary
              - replica
          uniqueItems: true
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: ENDPOINTS
    outputs: {}
