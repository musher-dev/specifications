specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      siteTitle:
        description: Title shown in the site header.
        schema:
          type: string
        target:
          envVarKey: SITE_TITLE
    outputs:
      siteTitle:
        description: Title shown in the site header, for a sibling that renders it.
        schema:
          type: string
        from:
          input: siteTitle
