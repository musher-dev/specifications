specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: PostgreSQL database with a single persistent data volume.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
    volumes:
      data:
        mountPath: /var/lib/postgresql/data
        minSizeGiB: 10
  contract:
    inputs:
      postgresPassword:
        description: Password the database superuser is created with.
        schema:
          type: string
        required: true
        target:
          envVarKey: POSTGRES_PASSWORD
        sensitive: true
      databaseName:
        description: Name of the database created on first start.
        schema:
          type: string
        default: app
        target:
          envVarKey: POSTGRES_DB
      dataDirectory:
        description: Directory inside the data volume PostgreSQL keeps its files in.
        schema:
          type: string
        default: /var/lib/postgresql/data/pgdata
        target:
          envVarKey: PGDATA
    outputs:
      address:
        description: Internal host and port clients reach the database at.
        schema:
          type: string
        from:
          endpoint: primary
          property: privateAddress
