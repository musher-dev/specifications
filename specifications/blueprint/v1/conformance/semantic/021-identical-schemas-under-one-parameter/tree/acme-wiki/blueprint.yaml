# The pass twin of semantic-008. `api` and `db` both declare `adminPassword`,
# and one parameter covers both. They differ in `required`, in the order the
# schema's keys are written, and in their wording of `description`. None of that
# is a conflict: the two schemas are equal once defaults are applied, which is
# the test BP-PARAM-002 states, and `required` and `description` sit outside the
# schema block. The field's help text is `api`'s description, since `api` sorts
# first.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    adminPassword:
      ui:
        label: Administrator password
