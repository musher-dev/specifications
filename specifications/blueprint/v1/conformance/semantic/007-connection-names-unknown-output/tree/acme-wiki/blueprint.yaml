specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings: {}
      exposure:
        primary: PRIVATE
      volumes: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        databaseUrl:
          type: OUTPUT
          node: db
          output: connectionUri
      exposure:
        primary: PRIVATE
      volumes: {}
  parameters: {}
