# The overview-image counterpart of case 005. `media/diagram.png` is a legal
# spelling (§5's grammar makes `..` unspellable), and it escapes by symlink
# instead, so containment has to be decided on the resolved location rather than
# on the string. §4.1 reaches an overview image with the same rule it reaches
# an icon with, and reports it at `/spec/overview`.
#
# The link is declared in metadata.json rather than committed. See ADR 0002 §3.
specVersion: v2
kind: LISTING
metadata:
  slug: acme-wiki
spec:
  itemType: BLUEPRINT
  displayName: Acme Wiki
  summary: A wiki backed by PostgreSQL
  category: PRODUCTIVITY
  lifecycleStage: STABLE
  overview: |
    ## Architecture

    ![The deployment topology](media/diagram.png)
  icon: media/icon.png
  screenshots:
    - file: media/overview.png
