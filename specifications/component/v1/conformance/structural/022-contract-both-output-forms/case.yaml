specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      postgresPassword:
        description: Password the database superuser is created with.
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: POSTGRES_PASSWORD
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: string
        presentationHint: CONNECTION_STRING
        source:
          type: ENDPOINT
          endpoint: primary
          property: privateAddress
      databaseName:
        description: Name of the database this component creates.
        schema:
          type: string
        source:
          type: LITERAL
          value: app
