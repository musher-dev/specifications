specVersion: v1
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    baseUrl:
      from: "${{ variables.llm.baseUrl }}"
  components:
    app:
      componentRef: ./app.yaml
      compute:
        profile: general.standard.small
      connectionBindings:
        llm:
          parameter: baseUrl
