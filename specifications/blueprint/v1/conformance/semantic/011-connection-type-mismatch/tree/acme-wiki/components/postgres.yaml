specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs: {}
    outputs:
      port:
        schema:
          type: number
        description: Port the database listens on.
        source:
          type: LITERAL
          value: 5432
