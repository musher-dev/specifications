# How this repository adopts musher-dev/engineering-conventions (EC-0001). The
# release it is checked against is pinned in .config/mise/config.toml, and
# `task check:conventions` runs the check with --fail-on warning, so every
# family is enforced (docs/adr/0037). There is no [adoption] table: without one,
# a family a later release adds is enforced too, and the upgrade that brings it
# fixes or waives what it reports.
#
# Every waiver says why, links a public issue that tracks its removal, and
# expires within 180 days; an expired waiver's findings come back.
schema_version = 1

[[waivers]]
requirement = "REPO-08"
reason = "The repository keeps its single-token name by decision (#149); engineering-conventions#132 proposes it as a kept name, and the waiver ends with the release that lists it."
tracking = "https://github.com/musher-dev/engineering-conventions/issues/132"
expires = "2027-03-27"
