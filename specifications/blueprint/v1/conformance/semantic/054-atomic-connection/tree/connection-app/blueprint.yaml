{
  "specVersion": "v1",
  "kind": "BLUEPRINT",
  "metadata": {
    "slug": "connection-app",
    "revision": 1,
    "description": "Synthetic conformance fixture blueprint."
  },
  "spec": {
    "parameters": {
      "primary": {
        "from": "${{ connections.llm.default }}"
      }
    },
    "components": {
      "app": {
        "componentRef": "./component.yaml",
        "compute": {
          "profile": "general.standard.small"
        },
        "bindings": {
          "url": {
            "node": "app-llm",
            "output": "baseURL"
          },
          "key": {
            "node": "app-llm",
            "output": "apiKey"
          },
          "model": {
            "node": "app-llm",
            "output": "model"
          }
        }
      },
      "app-llm": {
        "componentRef": "./component-llm.yaml",
        "bindings": {
          "llm": {
            "parameter": "primary"
          }
        }
      }
    }
  }
}
