specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs: {}
    outputs:
      identityHeader:
        description: Synthetic output.
        schema: { type: string }
        from: { endpoint: web, property: viewerIdentityHeader }
      trustedProxies:
        description: Synthetic output.
        schema: { type: array, items: { type: string } }
        from: { endpoint: web, property: trustedProxyCIDRs }
      identityHeaderLine:
        description: Synthetic output.
        schema: { type: string }
        from: { template: 'header=${{ self.endpoints.web.viewerIdentityHeader }}' }
