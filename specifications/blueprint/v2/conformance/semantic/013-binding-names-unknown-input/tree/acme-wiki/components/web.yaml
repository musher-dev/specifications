specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      databaseURL:
        schema:
          type: string
        required: false
        description: Connection string of the database the application stores its data in.
        sensitive: true
        presentationHint: CONNECTION_STRING
        target:
          envVar: DATABASE_URL
    outputs: {}
