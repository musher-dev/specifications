specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: PostgreSQL database with a single persistent data volume.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
    envVars:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: app
    volumes:
      data:
        mountPath: /var/lib/postgresql/data
        minSizeGiB: 10
  contract:
    inputs:
      postgresPassword:
        description: Password the database superuser is created with.
        schema:
          type: string
        required: true
        target:
          envVarKey: POSTGRES_PASSWORD
        sensitive: true
    outputs: {}
