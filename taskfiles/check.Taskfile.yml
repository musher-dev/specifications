# Check: every gate this repository runs, each named `check:<gate>`.
#
# Included flattened (TASK-20), so each task answers to the name written here.
#
# The aggregate entry point is `task check`, defined in the root Taskfile.yml:
# it runs all of these at once, as parallel deps. None may depend on another's
# result or write outside a scratch directory of its own.
#
# Each check names its config with the tool's own flag. Default discovery is
# never relied on -- see .config/README.md and docs/adr/0011.
#
# `dir:` is absolute via {{.ROOT_DIR}} throughout this directory. A relative
# `dir:` in an included taskfile resolves against *that file's* directory, so
# `dir: tools` here would silently mean `taskfiles/tools`.
version: '3'

tasks:
  # --- The non-normative surface: formatting, types, and repository layout ---

  check:format:
    desc: Check formatting and lint of the tooling sources
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # --error-on-warnings: `biome ci` alone passes with warnings, which then
      # accumulate unread behind a green job.
      - bun run biome ci --error-on-warnings .

  check:types:
    desc: Typecheck the tooling sources
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run tsc --noEmit

  check:config:
    desc: Verify the repository root holds only ROOT_ENTRIES (CFG-09)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/policy/config.ts

  check:rulesets:
    desc: Verify the review gate holds together (RUL-01..RUL-08)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/policy/rulesets.ts

  check:conventions:
    desc: Check the repository against the pinned engineering-conventions release
    dir: '{{.ROOT_DIR}}'
    cmds:
      # The release is pinned in .config/mise/config.toml (docs/adr/0036 §1).
      # Every family is enforced (docs/adr/0037): every requirement is a
      # warning, so --fail-on warning is what makes a finding fail. A finding
      # is fixed, or waived in .repo/conventions.toml with a reason, a tracking
      # issue and an expiry.
      - conventions check --fail-on warning

  # --- The normative gates ---------------------------------------------------

  check:schema:
    desc: Meta-validate schema modules, $id uniqueness, and $ref locality
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/schema/lint.ts

  check:generated:
    desc: Fail if git tracks any build output (dist/, schemas/dist, a root catalog.json)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/policy/generated.ts

  check:examples:
    desc: Validate every example document against its family bundle
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/conformance/examples.ts

  check:conformance:
    desc: Execute the conformance corpus
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/conformance/conformance.ts

  check:standards:
    desc: Meta-validate schemas with an independent JSON Schema toolchain
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/schema/standards.ts

  check:parity:
    desc: Require Ajv and Blaze to agree on every structural verdict
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/conformance/parity.ts

  check:test:
    desc: Run the tooling test suite
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun test

  # --- The publication record ------------------------------------------------

  check:published:
    desc: Verify every recorded release against git and the ledger, offline (docs/adr/0023 §4)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # Tagged entries by tree id and the tag's own ledger, never rebuilt;
      # pending entries against HEAD and a fresh pinned build. Needs full history
      # and tags: a shallow clone with a non-empty ledger fails.
      - bun run src/publication/verify.ts

  check:published:online:
    desc: Verify every tagged release's GitHub release and assets, without caching
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # Reads GITHUB_TOKEN, else `gh auth token`, else goes unauthenticated;
      # GITHUB_REPOSITORY overrides the repository derived from REPO_URL.
      - bun run src/publication/fetch.ts --verify-only

  check:ledger:
    desc: Fail if published.json changed anything already recorded (BASE_REF=<ref>)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # Compares against BASE_REF; without it only parses the ledger.
      - bun run src/publication/ledger.ts check

  check:editions:
    desc: Report where core stands and gate every pending kind family release on it
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/publication/core-gate.ts

  check:compat:
    desc: Replay every released version's accepted documents against the candidate schema
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/publication/compat.ts

  # --- Prose, workflows, and shell -------------------------------------------

  check:commits:
    desc: Hold every copy of the commit vocabulary in step with .config/commits/committed.toml
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/policy/commits.ts

  check:title:
    desc: Validate a pull request title's type, scope and subject against .config/commits/committed.toml (PR_TITLE=<title>)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # CI only, on pull requests: not part of `task check`, which has no title.
      # PR_TITLE is read from the environment and fails when unset.
      - bun run src/policy/title.ts

  check:docs:
    desc: Fail if docs/traceability.md, the ADR index, or docs/terminology.md and its Vale styles differ from a fresh generation
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # Regenerates each in memory and writes nothing; `task docs` is the fix.
      - bun run src/policy/docs.ts

  check:terms:
    desc: Hold the term records, the schema identifiers and the defined terms of each spec.md together
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # Record validity, the identifier scope and the defined terms all fail
      # the check (docs/adr/0038).
      - bun run src/policy/terms.ts

  check:links:
    desc: Resolve every internal Markdown link and anchor
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      - bun run src/policy/links.ts

  check:adr:
    desc: Verify ADR numbering and relations, and hold accepted ADRs to link-target-only edits (ADR-01..ADR-04)
    dir: '{{.ROOT_DIR}}/{{.TOOLS_DIR}}'
    cmds:
      # ADR-04 compares against BASE_REF when set, else origin/main, else skips.
      - bun run src/policy/adr.ts

  check:md:
    desc: Lint Markdown against .config/markdown/markdownlint.jsonc
    dir: '{{.ROOT_DIR}}'
    cmds:
      # MARKDOWN_GLOBS, in the root Taskfile.yml, names the files, and its
      # comment says why each exclusion is made: pull_request_template.md is a
      # form fragment with no title, and release-please's CHANGELOG.md is
      # generated. fmt:md fixes the same files.
      - >-
        tools/node_modules/.bin/markdownlint-cli2
        --config .config/markdown/markdownlint.jsonc
        {{.MARKDOWN_GLOBS}}

  check:spelling:
    desc: Spell-check prose, tooling sources, and schema descriptions
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >-
        tools/node_modules/.bin/cspell --dot --no-progress --no-summary --unique
        --config .config/spelling/cspell.json "**/*.md" "tools/src/**/*.ts" "**/*.schema.json"

  check:prose:
    desc: Lint the published prose with Vale against .config/markdown/vale.ini (COPY-01..COPY-04)
    dir: '{{.ROOT_DIR}}'
    cmds:
      # `vale sync` installs the MusherProse package, at the release the
      # conventions pin names, into the config's StylesPath, which .gitignore
      # ignores except for this repository's own style.
      - vale --config .config/markdown/vale.ini sync
      # The files are the ones the config's styled section matches: every
      # README, the guides under docs/ and the v2 specifications, without the
      # decision records, release-please's CHANGELOGs, the two history docs
      # (docs/downstream-v1-adoption.md and docs/pre-release-migration.md, which
      # must spell the vocabulary they retired) or the two generated pages,
      # docs/traceability.md and docs/terminology.md. Vale's globs match
      # the paths it is given, so it runs from the repository root. Vale exits
      # non-zero only for an error-level alert, so any alert it prints at the
      # config's MinAlertLevel fails the check here.
      - |
        set -eu
        alerts="$(git ls-files -z --cached --others --exclude-standard -- \
          README.md ':(glob)**/README.md' ':(glob)docs/**/*.md' ':(glob)specifications/*/v2/*.md' \
          ':(exclude,glob)docs/adr/**' ':(exclude,glob)**/CHANGELOG.md' \
          ':(exclude)docs/traceability.md' ':(exclude)docs/terminology.md' \
          ':(exclude)docs/downstream-v1-adoption.md' ':(exclude)docs/pre-release-migration.md' \
          | xargs -0 vale --config .config/markdown/vale.ini --output=line --no-exit)"
        if [ -n "${alerts}" ]; then
          printf '%s\n' "${alerts}"
          printf 'Vale reported %s alert(s); .config/markdown/vale.ini says which styles apply.\n' \
            "$(printf '%s\n' "${alerts}" | wc -l | tr -d ' ')" >&2
          exit 1
        fi

  check:shell:
    desc: ShellCheck the dev container scripts
    dir: '{{.ROOT_DIR}}'
    cmds:
      # No --severity: ShellCheck runs at its default severity, style, so every
      # finding fails. No config file either (.config/README.md says why).
      - shellcheck -x --source-path=SCRIPTDIR .devcontainer/scripts/*.sh .devcontainer/scripts/lib/*.sh

  check:shell:files:
    desc: ShellCheck specific files (used by the pre-commit hook)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - shellcheck -x --source-path=SCRIPTDIR {{.CLI_ARGS}}

  check:workflow:
    desc: Lint the GitHub Actions workflows
    dir: '{{.ROOT_DIR}}'
    cmds:
      - actionlint -config-file .config/actions/actionlint.yaml

  check:workflow:files:
    desc: Lint specific workflow files (used by the pre-commit hook)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - actionlint -config-file .config/actions/actionlint.yaml {{.CLI_ARGS}}
