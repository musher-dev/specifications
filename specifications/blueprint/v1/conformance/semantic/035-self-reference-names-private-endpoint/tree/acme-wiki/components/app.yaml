specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      internal:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      selfUrl:
        schema:
          type: string
        description: URL the application advertises for itself.
        target:
          envVarKey: SELF_URL
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        from:
          template: "${{ self.endpoints.internal.publicUrl }}"
