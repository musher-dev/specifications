specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Background worker that answers queued requests with a language model reached through an atomic connection.
spec:
  type: WORKER
  workload:
    source:
      image: ghcr.io/musher-dev/assistant-worker:2.3.0
  contract:
    inputs:
      baseUrl:
        description: Base URL of the language-model API.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: OPENAI_BASE_URL
      apiKey:
        description: Credential presented to the language-model API.
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: OPENAI_API_KEY
      model:
        description: Model the language-model API answers with.
        schema:
          type: string
        target:
          envVarKey: OPENAI_MODEL
    outputs: {}
    connectionRequirements:
      llm:
        protocol: OPENAI_CHAT_COMPLETIONS
        capabilities:
          - STREAMING
          - TOOL_CALLS
        inputs:
          baseUrl: baseUrl
          apiKey: apiKey
          model: model
