specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: ghcr.io/musher-dev/broker:3.13.7
    endpoints:
      amqp:
        targetPort: 5672
        protocol: TCP
      metrics:
        targetPort: 9090
        protocol: HTTP
  contract:
    inputs:
      brokerAddress:
        schema:
          type: string
        description: Edge address clients use to reach the broker.
        target:
          envVarKey: BROKER_ADDRESS
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        from:
          template: "${{ slef.publicAddress }}"
