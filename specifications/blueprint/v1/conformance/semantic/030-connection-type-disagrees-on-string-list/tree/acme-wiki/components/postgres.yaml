specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs: {}
    outputs:
      replica:
        schema:
          type: string
        description: Which replica this database serves as.
        source:
          type: LITERAL
          value: primary
