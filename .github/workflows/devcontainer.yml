name: Dev Container

on:
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.config/mise/**', '.github/workflows/devcontainer.yml']
  pull_request:
    branches: [main]
    paths: ['.devcontainer/**', '.config/mise/**', '.github/workflows/devcontainer.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=SCRIPTDIR
        with:
          scandir: .devcontainer/scripts

  lockfile:
    name: Feature Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --frozen-lockfile fails if devcontainer-lock.json is missing or if its
      # resolved Feature digests drift from devcontainer.json.
      - name: Enforce devcontainer-lock.json is current
        run: npx -y @devcontainers/cli build --workspace-folder . --frozen-lockfile

  env_check:
    name: Env Template Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify .env and .env.example stay in sync
        run: |
          cp .devcontainer/.env.example .devcontainer/.env
          task env:check
