specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  revision: 1
  description: A web application backed by PostgreSQL on dedicated compute and fast local storage.
spec:
  parameters:
    postgresPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
    siteTitle:
      ui:
        label: Site title
      default: My site
    telemetry:
      ui:
        label: Telemetry to export
        prominence: SECONDARY
        enumLabels:
          logs: Logs
          metrics: Metrics
          traces: Traces
  components:
    db:
      componentRef: ./components/postgres.yaml
      compute:
        profile: general.standard.medium
        placement:
          cpuDedication: dedicated
      volumes:
        data:
          sizeGiB: 20
          storageClass: local-nvme
          minIOPS: 3000
      bindings:
        postgresPassword:
          parameter: postgresPassword
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      exposure:
        web: PUBLIC
      bindings:
        databaseAddress:
          node: db
          output: address
        databasePassword:
          parameter: postgresPassword
        siteTitle:
          parameter: siteTitle
        telemetry:
          parameter: telemetry
        mode:
          value: production
