specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: ghcr.io/musher-dev/broker:3.13.7
    endpoints:
      amqp:
        containerPort: 5672
        protocol: TCP
      metrics:
        containerPort: 9090
        protocol: HTTP
  contract:
    inputs:
      brokerAddress:
        schema:
          type: string
        description: Edge address clients use to reach the broker.
        target:
          envVarKey: BROKER_ADDRESS
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        source:
          type: TEMPLATE
          template: amqp://${{ self.publicAddress.amqp }}/vhost
