# Featured-row placement is set by the storefront operator, not by the author
# of a listing document, so `spec.featured` is not part of this specification. A
# document that declares it is rejected like any other unknown property:
# silently ignoring it would let an author believe they had promoted their own
# listing.
specVersion: v2
kind: LISTING
metadata:
  slug: postgres
spec:
  itemType: COMPONENT
  displayName: PostgreSQL
  summary: The open-source relational database
  category: DATABASES
  lifecycleStage: STABLE
  featured:
    enabled: true
    rank: 0
