specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: web
        type: HTTP
  contract:
    inputs: {}
    outputs:
      baseUrl:
        description: Address this service answers on.
        schema:
          type: string
        source:
          type: TEMPLATE
          template: ${{ config.baseUrl }}
