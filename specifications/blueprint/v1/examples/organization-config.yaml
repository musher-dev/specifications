specVersion: v1
kind: BLUEPRINT
metadata:
  slug: organization-config
  revision: 1
spec:
  components:
    worker:
      componentRef: ./components/llm-worker.yaml
      size: general.standard.small
      bindings:
        llmBaseUrl:
          type: CONFIG_REF
          source: "${{ config.llm.baseUrl }}"
        llmApiKey:
          type: CONFIG_REF
          source: "${{ config.llm.apiKey }}"
