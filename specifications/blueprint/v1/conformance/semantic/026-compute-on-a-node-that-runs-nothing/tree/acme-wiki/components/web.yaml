specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: ghcr.io/example/app:1.4.2
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: web
        type: HTTP
  contract:
    inputs:
      llmBaseUrl:
        schema:
          type: string
        target:
          envVarKey: OPENAI_API_BASE_URL
        description: Base URL of the chat-completions service the application calls.
        presentationHint: ENDPOINT_URL
      llmApiKey:
        schema:
          type: string
        target:
          envVarKey: OPENAI_API_KEY
        description: Credential the application presents to the chat-completions service.
        sensitive: true
    outputs: {}
