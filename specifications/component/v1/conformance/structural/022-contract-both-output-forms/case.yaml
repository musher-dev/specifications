# The whole contract surface in one document: an input marked sensitive, an output the platform resolves, and an output this document
# states outright.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      postgresPassword:
        description: Password the database superuser is created with.
        schema:
          type: STRING
          sensitive: true
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: STRING
          format: CONNECTION_STRING
        valueFrom: DERIVED
      databaseName:
        description: Name of the database this component creates.
        schema:
          type: STRING
        valueFrom: DECLARED
        value: app
