specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/service:1
    endpoints:
      primary:
        targetPort: 8080
        protocol: TCP
  contract:
    inputs:
      secret:
        schema:
          type: string
          minLength: 8
          pattern: ^[A-Za-z0-9]+$
        description: Synthetic input.
        target:
          envVar: STORE_SECRET
    outputs: {}
