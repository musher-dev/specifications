# The positive side of COMP-OUT-002: the named input exists. Whether a wire
# fills it is not this document's to know; blueprint §4.2 rejects a connection
# into an input an INPUT output reads, which is where §6.2's invariant is kept.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      apiToken:
        description: Bearer token the service accepts on its API.
        schema:
          type: STRING
          sensitive: true
        target:
          envVarKey: API_TOKEN
    outputs:
      apiToken:
        description: The bearer token this service accepts, for a client that calls it.
        schema:
          type: STRING
          sensitive: true
        valueFrom: INPUT
        input: apiToken
