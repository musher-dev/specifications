specVersion: v1
kind: BLUEPRINT
metadata:
  slug: postgres
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings:
        postgresPassword:
          type: PARAMETER
          parameter: postgresPassword
      volumes:
        data:
          sizeGiB: 10
  parameters:
    postgresPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
