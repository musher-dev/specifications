# A STRING_LIST with no members named is an unconstrained list of strings, which
# is what JSON already is, and an install form would have no members to offer
# (blueprint §5.3).
# `enum` is REQUIRED here rather than merely non-empty when written, so an
# absent one is the field an author has to add: ERR_MISSING_FIELD, anchored at
# the object that should have carried it.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: STRING_LIST
    outputs: {}
