# The member for a value that is several of a named set.
# `enum` is required and non-empty, and it constrains each member of the array
# rather than the array — which is why `default` is `'["logs"]'` and not `logs`:
# the string form is the array, so a default is that array's text.
#
# The output is here because §6.3 defines one block for an input and an output
# alike, and a member proved only on the input half is a member proved halfway.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: STRING_LIST
          enum:
            - logs
            - metrics
            - traces
          default: '["logs"]'
        required: false
    outputs:
      exported:
        description: Telemetry signals the service exports, for a collector to expect.
        schema:
          type: STRING_LIST
          enum:
            - logs
            - metrics
            - traces
        valueFrom: DECLARED
        value: '["logs","metrics"]'
