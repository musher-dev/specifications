# The control is derived from the covered inputs' schema (§5.3), so a ui block
# that names one states the same fact twice with nothing to say which is right.
# The block is closed, and a widget member is one it does not name.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    backend:
      ui:
        label: Storage backend
        widget: SELECT
