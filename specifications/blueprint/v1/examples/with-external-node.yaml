specVersion: v1
kind: BLUEPRINT
metadata:
  slug: with-external-node
  revision: 1
spec:
  components:
    models:
      componentRef: ./components/models.yaml
      size: null
      bindings:
        baseUrl:
          type: CONFIG_REF
          source: ${{ config.llm.baseUrl }}
        apiKey:
          type: CONFIG_REF
          source: ${{ config.llm.apiKey }}
        model:
          type: PARAMETER
          parameter: model
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        llmBaseUrl:
          type: OUTPUT
          node: models
          output: baseUrl
        llmApiKey:
          type: OUTPUT
          node: models
          output: apiKey
        llmModel:
          type: OUTPUT
          node: models
          output: model
  parameters:
    model:
      ui:
        label: Model name
        order: 3
        prominence: SECONDARY
      default: example-model
