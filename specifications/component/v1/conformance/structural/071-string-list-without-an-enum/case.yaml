specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
        target:
          envVarKey: TELEMETRY
    outputs: {}
