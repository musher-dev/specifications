specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    baseUrl:
      ui:
        label: API base URL
        order: 1
    apiKey:
      ui:
        label: API key
        order: 2
  components:
    models:
      componentRef: ./components/models.yaml
      bindings:
        baseUrl:
          parameter: baseUrl
        apiKey:
          parameter: apiKey
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        web: PUBLIC
      bindings:
        llmBaseUrl:
          node: models
          output: baseUrl
        llmApiKey:
          node: models
          output: apiKey
