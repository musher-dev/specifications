specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        secretKey:
          type: PARAMETER
          parameter: secretKey
  parameters:
    secretKey:
      generator:
        byteLength: 32
        encoding: HEX
      default: ${{ self.publicUrl }}
      ui:
        label: Secret key
