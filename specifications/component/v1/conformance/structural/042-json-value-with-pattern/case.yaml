specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      settings:
        description: Advanced settings, as a JSON document merged over the defaults.
        schema:
          type: object
          pattern: ^\{.*\}$
          properties: {}
          additionalProperties: false
        target:
          envVarKey: SETTINGS
    outputs: {}
