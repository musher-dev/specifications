specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      api:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: api
          path: /healthz
  contract:
    inputs:
      consoleUrl:
        schema:
          type: string
        description: Public URL of the administration console.
        target:
          envVarKey: CONSOLE_URL
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        from:
          template: "${{ self.endpoints.console.publicUrl }}"
