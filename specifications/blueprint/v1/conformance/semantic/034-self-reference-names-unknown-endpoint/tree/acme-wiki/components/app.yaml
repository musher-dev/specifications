specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: api
        type: HTTP
  contract:
    inputs:
      consoleUrl:
        schema:
          type: string
        description: Public URL of the administration console.
        target:
          envVarKey: CONSOLE_URL
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        source:
          type: TEMPLATE
          template: ${{ self.publicUrl.console }}
