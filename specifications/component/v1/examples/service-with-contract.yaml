specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
    envVars:
      - key: PGDATA
        value:
          type: LITERAL
          value: /var/lib/postgresql/data/pgdata
      - key: POSTGRES_DB
        value:
          type: LITERAL
          value: app
    volumes:
      data:
        mountPath: /var/lib/postgresql/data
        minimumSizeGiB: 10
  contract:
    inputs:
      postgresPassword:
        description: Password the database superuser is created with.
        schema:
          type: string
        required: true
        target:
          envVarKey: POSTGRES_PASSWORD
        sensitive: true
    outputs: {}
