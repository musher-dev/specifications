specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      adminPassword:
        schema:
          type: number
        description: Password of the administrator account the component creates on first start.
        sensitive: true
        target:
          envVarKey: ADMIN_PASSWORD
    outputs: {}
