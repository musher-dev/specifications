specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    deploymentID: { from: "${{ deployment.id }}" }
  nodes:
    web:
      componentRef: ./web.yaml
      compute:
        profile: general.standard.small
      bindings:
        value: { parameter: deploymentID }
