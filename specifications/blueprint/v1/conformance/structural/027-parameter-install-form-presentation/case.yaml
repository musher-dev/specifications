# A parameter carries the ui block §5.3 defines, and nothing about the value it
# collects: the shape, the enum the labels name and the description all belong
# to the inputs the parameter covers. This case has no item root, so it pins the
# block's structure alone; whether `S3` and `GCS` are members of a covered
# input's enum is semantic/022's question.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    backend:
      ui:
        label: Storage backend
        order: 1
        enumLabels:
          S3: Amazon S3
          GCS: Google Cloud Storage
    hostname:
      ui:
        label: Public hostname
        order: 2
        prominence: SECONDARY
        examples:
          - wiki.example.com
