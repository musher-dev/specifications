specVersion: v1
kind: BLUEPRINT
metadata:
  slug: inference
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: gpu.performance.large
      placement:
        cpuArchitectures:
          - x86_64
          - arm64
        cpuDedication: dedicated
        minAcceleratorMemoryGiB: 24
        acceleratorRuntimes:
          - cuda
        acceleratorInterconnect: nvlink
        acceleratorSKUClass: h100-sxm
        storageClass: local-nvme
        minStorageIOPS: 20000
        networkClass: standard
      bindings: {}
  parameters: {}
