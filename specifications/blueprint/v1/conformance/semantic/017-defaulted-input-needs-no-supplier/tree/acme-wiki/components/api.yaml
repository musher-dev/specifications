specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      siteTitle:
        schema:
          type: string
        required: true
        description: Title the application shows in its header.
        default: Acme Wiki
        target:
          envVarKey: SITE_TITLE
    outputs: {}
