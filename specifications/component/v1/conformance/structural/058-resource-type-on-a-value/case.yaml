specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      tenantKey:
        description: Tenant key identifying this installation to the Acme billing API.
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: TENANT_KEY
        resourceType: dev.musher.llm.base-url
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: string
        sensitive: true
        from:
          endpoint: primary
          property: privateAddress
