specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    baseURL:
      ui:
        label: API base URL
        order: 1
    apiKey:
      ui:
        label: API key
        order: 2
  components:
    models:
      componentRef: ./components/models.yaml
      bindings:
        baseURL:
          parameter: baseURL
        apiKey:
          parameter: apiKey
    web:
      componentRef: ./components/web.yaml
      volumes: {}
      exposure:
        web: PUBLIC
      bindings:
        llmBaseURL:
          node: models
          output: baseURL
        llmApiKey:
          node: models
          output: apiKey
