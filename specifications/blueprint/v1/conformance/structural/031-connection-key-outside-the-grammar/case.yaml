specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        DATABASE_URL:
          type: OUTPUT
          node: db
          output: connectionString
  parameters: {}
