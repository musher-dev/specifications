specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      tenantKey:
        description: Tenant key identifying this installation to the Acme billing API.
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: TENANT_KEY
        resourceType: dev.musher.llm.base-url
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: string
        sensitive: true
        source:
          type: ENDPOINT
          endpoint: primary
          property: privateAddress
