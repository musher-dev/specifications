specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.medium
      placement:
        cpuDedication: dedicated
      bindings:
        postgresPassword:
          type: PARAMETER
          parameter: postgresPassword
      volumes:
        data:
          sizeGiB: 20
    web:
      componentRef: ./component-web-server.yaml
      size: general.standard.small
      bindings:
        databaseUrl:
          type: OUTPUT
          node: db
          output: connectionString
        siteTitle:
          type: PARAMETER
          parameter: siteTitle
        callbackUrl:
          type: OUTPUT
          node: web
          output: callbackUrl
        telemetry:
          type: PARAMETER
          parameter: telemetry
      exposure:
        web: PUBLIC
  parameters:
    postgresPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
    siteTitle:
      ui:
        label: Site title
    telemetry:
      ui:
        label: Telemetry to export
        prominence: SECONDARY
        enumLabels:
          logs: Logs
          metrics: Metrics
          traces: Traces
