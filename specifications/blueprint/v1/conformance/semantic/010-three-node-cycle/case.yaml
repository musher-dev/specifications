specVersion: v1
kind: BLUEPRINT
metadata:
  slug: mutual-discovery
  revision: 1
spec:
  components:
    queue:
      componentRef: ./components/queue.yaml
      size: general.standard.small
      bindings:
        dbUrl:
          type: OUTPUT
          node: db
          output: privateAddress
    db:
      componentRef: ./components/db.yaml
      size: general.standard.small
      bindings:
        cacheUrl:
          type: OUTPUT
          node: cache
          output: privateAddress
    cache:
      componentRef: ./components/cache.yaml
      size: general.standard.small
      bindings:
        queueUrl:
          type: OUTPUT
          node: queue
          output: privateAddress
  parameters: {}
