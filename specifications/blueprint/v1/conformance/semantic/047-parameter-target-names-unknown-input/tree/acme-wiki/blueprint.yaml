# `toInput` names the input key covered. One that no covered node declares
# covers nothing, and the field that caused it is where it is reported.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    app:
      componentRef: ./components/app.yaml
      size: general.standard.small
      connections: {}
  parameters:
    brokerAddress:
      toInput: amqpAddress
      ui:
        label: Broker address
