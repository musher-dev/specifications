specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    ownerPassword: { generator: { byteLength: 24, encoding: BASE64URL }, ui: { label: Owner password } }
    ownerPasswordHash: { hash: { parameter: ownerPassword, algorithm: ARGON2ID } }
    ownerEmail: { from: "${{ deployment.creator.email }}" }
    ownerName: { from: "${{ deployment.creator.name }}" }
    ownerIdentity: { from: "${{ deployment.creator.identity }}" }
  nodes:
    web:
      componentRef: ./web.yaml
      compute:
        profile: general.standard.small
      bindings:
        ownerPasswordHash: { parameter: ownerPasswordHash }
        ownerEmail: { parameter: ownerEmail }
        ownerName: { parameter: ownerName }
        ownerIdentity: { parameter: ownerIdentity }
