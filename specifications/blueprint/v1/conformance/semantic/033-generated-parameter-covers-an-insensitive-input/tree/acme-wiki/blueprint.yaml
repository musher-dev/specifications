specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      bindings:
        signingKey:
          type: PARAMETER
          parameter: signingKey
      exposure: {}
      volumes: {}
  parameters:
    signingKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Signing key
