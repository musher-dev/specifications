specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    adminPassword:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Administrator password
  components:
    db:
      componentRef: ./components/postgres.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings:
        adminPassword:
          parameter: adminPassword
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings:
        databaseURL:
          node: db
          output: connectionString
        adminPassword:
          parameter: adminPassword
