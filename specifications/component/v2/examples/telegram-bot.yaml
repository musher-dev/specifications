specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Telegram bot reached through a connection, handing its API base URL and token to the node that runs it.
spec:
  type: EXTERNAL
  contract:
    inputs:
      telegram:
        description: Telegram bot this node stands for.
        connection:
          protocol: TELEGRAM_BOT
    outputs:
      baseURL:
        description: Base URL of the Telegram Bot API, the public one unless the connection names another.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        from:
          input: telegram
          member: baseURL
      botToken:
        description: Token the Telegram Bot API accepts for the bot.
        schema:
          type: string
        sensitive: true
        from:
          input: telegram
          member: botToken
