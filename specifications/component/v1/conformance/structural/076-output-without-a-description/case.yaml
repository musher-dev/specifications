specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs: {}
    outputs:
      baseUrl:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        source:
          type: ENDPOINT
          endpoint: web
          property: publicUrl
