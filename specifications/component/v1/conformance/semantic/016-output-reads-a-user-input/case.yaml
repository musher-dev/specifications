specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      apiToken:
        description: Bearer token the service accepts on its API.
        schema:
          type: string
        target:
          envVarKey: API_TOKEN
        sensitive: true
    outputs:
      apiToken:
        description: The bearer token this service accepts, for a client that calls it.
        schema:
          type: string
        sensitive: true
        from:
          input: apiToken
