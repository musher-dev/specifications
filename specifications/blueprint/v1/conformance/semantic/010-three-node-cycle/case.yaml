specVersion: v1
kind: BLUEPRINT
metadata:
  slug: mutual-discovery
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  components:
    queue:
      componentRef: ./components/queue.yaml
      compute:
        profile: general.standard.small
      bindings:
        dbUrl:
          node: db
          output: privateAddress
    db:
      componentRef: ./components/db.yaml
      compute:
        profile: general.standard.small
      bindings:
        cacheUrl:
          node: cache
          output: privateAddress
    cache:
      componentRef: ./components/cache.yaml
      compute:
        profile: general.standard.small
      bindings:
        queueUrl:
          node: queue
          output: privateAddress
