specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  nodes:
    web:
      componentRef: ./web.yaml
      compute:
        profile: general.standard.small
      exposure:
        web:
          visibility: PUBLIC
          access: RESTRICTED
          viewerIdentity: HEADER
      bindings: 
        identityHeader: { node: web, output: identityHeader }
        trustedProxies: { node: web, output: trustedProxies }
        publicOrigin: { node: web, output: publicURL }
