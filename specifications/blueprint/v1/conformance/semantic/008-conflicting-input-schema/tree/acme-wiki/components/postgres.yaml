specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      adminPassword:
        schema:
          type: number
        description: Password of the administrator account the component creates on first start.
        sensitive: true
        target:
          envVarKey: ADMIN_PASSWORD
    outputs: {}
