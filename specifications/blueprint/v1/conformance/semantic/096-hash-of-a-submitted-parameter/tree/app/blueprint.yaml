specVersion: v1
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    password: { ui: { label: Password } }
    passwordHash: { hash: { parameter: password, algorithm: ARGON2ID } }
  components:
    web:
      componentRef: ./web.yaml
      compute:
        profile: general.standard.small
      bindings:
        password: { parameter: password }
        passwordHash: { parameter: passwordHash }
