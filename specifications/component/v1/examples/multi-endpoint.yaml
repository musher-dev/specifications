specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Message broker with an HTTP API, an admin console, a TCP wire protocol and a metrics endpoint.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      api:
        targetPort: 8080
        protocol: HTTP
      console:
        targetPort: 8081
        protocol: HTTP
      wire:
        targetPort: 5671
        protocol: TCP
      metrics:
        targetPort: 9090
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: api
          path: /healthz
  contract:
    inputs:
      consoleUrl:
        description: Public URL the admin console is served at.
        schema:
          type: string
        target:
          envVarKey: CONSOLE_URL
      wireAddress:
        description: Edge address clients use to reach the wire protocol.
        schema:
          type: string
        target:
          envVarKey: WIRE_ADDRESS
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: array
          items:
            type: string
            enum:
              - logs
              - metrics
              - traces
          uniqueItems: true
        required: false
        target:
          envVarKey: TELEMETRY_EXPORTERS
        default:
          - logs
          - metrics
    outputs:
      consoleEndpoint:
        description: Address the admin console answers on.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        from:
          template: "https://${{ self.endpoints.console.publicHostname }}/admin"
