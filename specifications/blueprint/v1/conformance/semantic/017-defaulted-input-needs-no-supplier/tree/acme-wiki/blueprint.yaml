# Both inputs are required, and neither needs a supplier. `siteTitle` and
# `databaseName` each declare a `schema.default`, so the component already has
# the value it needs when nothing else provides one. With every required input
# satisfied, the blueprint writes no parameters at all, and absent means a form
# with no fields.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
