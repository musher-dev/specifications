specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      settings:
        description: Advanced settings, as a JSON document merged over the defaults.
        schema:
          type: object
          properties:
            logLevel:
              type: string
          additionalProperties: false
        default:
          logLevel: info
        target:
          envVarKey: SETTINGS
    outputs:
      topology:
        description: Cluster topology, as a JSON document.
        schema:
          type: object
          properties:
            shards:
              type: integer
          additionalProperties: false
        from:
          value:
            shards: 1
