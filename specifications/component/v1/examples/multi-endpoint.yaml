specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
      console:
        containerPort: 8081
        protocol: HTTP
      wire:
        containerPort: 5671
        protocol: TCP
      metrics:
        containerPort: 9090
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: api
        type: HTTP
  contract:
    inputs:
      consoleUrl:
        description: Public URL the admin console is served at.
        schema:
          type: string
        target:
          envVarKey: CONSOLE_URL
      wireAddress:
        description: Edge address clients use to reach the wire protocol.
        schema:
          type: string
        target:
          envVarKey: WIRE_ADDRESS
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: array
          items:
            type: string
            enum:
              - logs
              - metrics
              - traces
          uniqueItems: true
        required: false
        target:
          envVarKey: TELEMETRY_EXPORTERS
        default:
          - logs
          - metrics
    outputs:
      consoleEndpoint:
        description: Address the admin console answers on.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        source:
          type: TEMPLATE
          template: https://${{ self.publicHostname.console }}/admin
