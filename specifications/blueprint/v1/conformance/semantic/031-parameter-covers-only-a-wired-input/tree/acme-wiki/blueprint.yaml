specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    adminPassword:
      ui:
        label: Administrator password
    databaseUrl:
      ui:
        label: Database URL
  components:
    db:
      componentRef: ./components/postgres.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings: {}
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        primary: PRIVATE
      bindings:
        databaseUrl:
          node: db
          output: connectionString
        adminPassword:
          parameter: adminPassword
