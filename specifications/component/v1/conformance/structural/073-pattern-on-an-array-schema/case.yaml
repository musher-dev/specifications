specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
  contract:
    inputs:
      telemetry:
        description: Telemetry signals the service exports.
        schema:
          type: array
          pattern: ^\[.*\]$
          items:
            type: string
            enum:
              - logs
              - metrics
          uniqueItems: true
        target:
          envVarKey: TELEMETRY
    outputs: {}
