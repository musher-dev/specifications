# The composition the external shape exists for. `models` is a node this
# platform does not run — no image, no compute, `size: null` — and `web` is one
# it does. The two wires carry an address and a credential from one node, which
# is the point: they are only meaningful as a set, and taking both from one
# `fromNode` is what makes that structural rather than hoped for.
#
# `models` declares two required inputs, and the parameters cover them: the
# deploying user is asked for an address and a credential once, together, in
# the order the blueprint gives. `web`'s two inputs are wired and never reach
# the form. The key is concealed because the covered input is sensitive.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    models:
      componentRef: ./components/models.yaml
      size: null
      connections: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections:
        llmBaseUrl:
          fromNode: models
          fromOutput: baseUrl
        llmApiKey:
          fromNode: models
          fromOutput: apiKey
  parameters:
    baseUrl:
      ui:
        label: API base URL
        order: 1
    apiKey:
      ui:
        label: API key
        order: 2
