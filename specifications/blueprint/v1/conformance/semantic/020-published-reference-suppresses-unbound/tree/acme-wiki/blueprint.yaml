# The regression pin for BP-PARAM-001 degrading.
#
# `api` names its component by UUID, so its inputs belong to the capability
# phase and this phase never sees them. `apiKey` is the input it declares and
# the parameter that covers it, but a validator reading only the repo-local
# half has no way to know that, and the key matches nothing in `db`.
#
# Reporting ERR_UNBOUND_PARAMETER here would be a claim about inputs the
# implementation was never given the means to read. The other rules degrade on
# their own: `db`'s one input is optional and defaulted, so nothing has to be
# supplied, and there is no readable input to compare a schema against.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: 018f6b3a-4c21-7b8e-9d5f-2a1c6e0b4d73
      revision: 3
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    apiKey:
      ui:
        label: API key
