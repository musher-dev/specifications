specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    apiKey:
      ui:
        label: API key
  components:
    models:
      componentRef: ./components/models.yaml
      bindings:
        baseURL:
          node: web
          output: publicURL
        apiKey:
          parameter: apiKey
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      volumes: {}
      exposure:
        web: PUBLIC
      bindings:
        llmBaseURL:
          node: models
          output: baseURL
