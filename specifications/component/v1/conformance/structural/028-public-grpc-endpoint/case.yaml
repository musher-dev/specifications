specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      rpc:
        containerPort: 8080
        protocol: GRPC
    health:
      readiness:
        path: /healthz
        endpoint: rpc
        type: HTTP
