specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    envVars:
      - key: database-url
        value:
          type: LITERAL
          value: postgres://localhost/app
