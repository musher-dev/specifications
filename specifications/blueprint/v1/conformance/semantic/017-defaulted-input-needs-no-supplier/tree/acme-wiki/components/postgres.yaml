specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      databaseName:
        schema:
          type: string
        description: Name of the database created on first start.
        default: app
        target:
          envVarKey: DATABASE_NAME
    outputs: {}
