specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    temporal:
      from: ${{ exports.temporal-frontend }}
  nodes:
    server:
      componentRef: ./components/server.yaml
      compute:
        profile: general.standard.small
      bindings:
        temporalURL:
          node: other
          output: url
          property: privateAddress
