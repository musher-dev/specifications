specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      db:
        targetPort: 5432
        protocol: TCP
    envVars:
      DATABASE_URL: postgres://localhost/app
  contract:
    inputs:
      databaseUrl:
        description: Connection URL of the database the service reads and writes.
        schema:
          type: string
        target:
          envVarKey: DATABASE_URL
