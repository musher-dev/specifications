specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    volumes:
      data:
        mountPath: /var/lib/app
        minSizeGiB: 1
    files:
      settings:
        path: /var/lib/app/settings.yml
        content:
          value: x
