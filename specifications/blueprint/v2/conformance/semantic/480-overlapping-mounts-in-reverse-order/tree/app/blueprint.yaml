specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters: {}
  nodes:
    realtime:
      componentRef: ./components/realtime.yaml
      compute:
        profile: general.standard.small
      exposure:
        socket:
          visibility: PUBLIC
          mount:
            node: app
            endpoint: web
            path: /s3/uploads
    blob:
      componentRef: ./components/blob.yaml
      compute:
        profile: general.standard.small
      exposure:
        socket:
          visibility: PUBLIC
          mount:
            node: app
            endpoint: web
            path: /s3
    app:
      componentRef: ./components/app.yaml
      compute:
        profile: general.standard.small
      exposure:
        web:
          visibility: PUBLIC
          access: RESTRICTED
