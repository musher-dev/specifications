specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      db:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs:
      databaseUrl:
        schema:
          type: string
        description: Connection URL clients outside the item use to reach the database.
        target:
          envVarKey: DATABASE_URL
    outputs:
      installDefault:
        description: Node-specific default address
        schema:
          type: string
        source:
          type: TEMPLATE
          template: ${{ self.publicUrl.db }}
