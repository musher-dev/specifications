specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
  contract:
    inputs: {}
    outputs:
      connectionString:
        description: Connection string a client uses to reach this database.
        schema:
          type: string
        source:
          type: ENDPOINT
          endpoint: primary
          property: privateAddress
        resourceType: bad
