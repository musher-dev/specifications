# Musher Specification Taskfile
# Usage: task [task-name]
# List tasks: task --list
#
# This file stays at the repo root because Task only discovers `Taskfile.*`
# there: `--taskfile` would work but would break bare `task <name>`. It holds
# the entry points; the tasks themselves live in taskfiles/, included below.
# Everything else this repository configures lives in .config/ — see
# .config/README.md and docs/adr/0011-tooling-configuration-layout.md.

version: '3'

# The aggregates below run their checks as parallel deps, so each task's output
# is held until it finishes and printed in one block rather than interleaved.
# Under GitHub Actions each block is a collapsible log group.
output:
  group:
    begin: '{{if .GITHUB_ACTIONS}}::group::{{end}}task: {{.TASK}}'
    end: '{{if .GITHUB_ACTIONS}}::endgroup::{{end}}'

vars:
  TOOLS_DIR: tools
  # Build output: `task site:build` creates it, so it is not named `_DIR`, which
  # promises a directory the repository holds (TASK-08).
  SITE: site
  # The Markdown that check:md lints and fmt:md fixes, as markdownlint-cli2
  # globs, where a leading `#` excludes. Installed dependencies and build output
  # are not linted, nor is a worktree checked out under .claude/worktrees, nor
  # .config/markdown/styles, where `vale sync` downloads its packages.
  #
  # pull_request_template.md is excluded because it is a form fragment, not
  # a document: GitHub renders it into a textarea, so it has no title and
  # MD041 would be asking it to grow one.
  #
  # release-please writes specifications/*/v*/CHANGELOG.md. It is generated,
  # its blank-line style (two blank lines before a `###` section) violates
  # MD012, and a fix here would be overwritten by the next release pull
  # request — so it is excluded rather than linted or rewritten.
  MARKDOWN_GLOBS: >-
    "**/*.md" "#tools/node_modules" "#site" "#.claude/worktrees" "#.github/pull_request_template.md"
    "#specifications/*/v*/CHANGELOG.md" "#.config/markdown/styles"

# No `env:` sets BUN_INSTALL_CACHE_DIR: the dev container sets it in
# devcontainer.json, and anywhere else bun's own default applies. A path into
# one user's home here would break every other checkout (TASK-16).

# Every fragment is flattened (TASK-20), so each task answers to the name its
# fragment writes. The fragments write their full names (`check:format`,
# `ci:lint`, `setup:tools`), so those names, which CI, the hooks and
# CONTRIBUTING use, did not change when the namespaces went away.
includes:
  setup:
    taskfile: taskfiles/setup.Taskfile.yml
    flatten: true
  build:
    taskfile: taskfiles/build.Taskfile.yml
    flatten: true
  check:
    taskfile: taskfiles/check.Taskfile.yml
    flatten: true
  ci:
    taskfile: taskfiles/ci.Taskfile.yml
    flatten: true
  release:
    taskfile: taskfiles/release.Taskfile.yml
    flatten: true
  contracts:
    taskfile: taskfiles/contracts.Taskfile.yml
    flatten: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ===========================================================================
  # Entry points
  #
  # The two aggregates live here rather than as a `default` inside their
  # modules: an included `default` is reachable as the bare namespace, but
  # `task --list` shows it as `check:default`, which hides the command a
  # newcomer most needs to find.
  # ===========================================================================

  setup:
    desc: Install tooling dependencies and git hooks
    cmds:
      - task: setup:tools
      - task: setup:hooks

  # Every check reads the tree and writes only to its own scratch directory, so
  # they run as parallel deps: a failure in one does not stop the others, and
  # the run fails once all of them have finished and reported.
  check:
    desc: Run every check CI runs, in parallel
    deps:
      - task: check:format
      - task: check:config
      - task: check:rulesets
      - task: check:conventions
      - task: check:types
      - task: check:schema
      - task: check:generated
      - task: check:examples
      - task: check:conformance
      - task: check:standards
      - task: check:parity
      - task: check:published
      - task: check:editions
      - task: check:compat
      - task: check:test
      - task: check:commits
      - task: check:docs
      - task: check:terms
      - task: check:links
      - task: check:adr
      - task: check:md
      - task: check:spelling
      - task: check:prose
      - task: check:shell
      - task: check:workflow

  lint:
    desc: Run the lint suite CI runs
    cmds:
      - task: ci:lint

  # ===========================================================================
  # Formatting
  # ===========================================================================

  fmt:
    desc: Format the tooling sources
    dir: '{{.TOOLS_DIR}}'
    cmds:
      - bun run biome format --write .

  fmt:md:
    desc: Apply the Markdown fixes markdownlint can make itself
    cmds:
      # The files check:md lints, MARKDOWN_GLOBS above, whose comment says why
      # each exclusion is made: release-please's CHANGELOG.md, for one, is
      # generated, and rewriting it would only be undone by the next release
      # pull request.
      - >-
        tools/node_modules/.bin/markdownlint-cli2 --fix
        --config .config/markdown/markdownlint.jsonc
        {{.MARKDOWN_GLOBS}}

  # ===========================================================================
  # Environment
  # ===========================================================================

  env:check:
    desc: Verify .devcontainer/.env has every key from .env.example
    cmds:
      - |
        bash -c '
        source .devcontainer/scripts/lib/env-check.sh
        env_check_drift .devcontainer/.env .devcontainer/.env.example
        '

  # ===========================================================================
  # Hooks
  #
  # Lefthook's pre-commit jobs call the check tasks themselves
  # (.config/lefthook.yml); its pre-push job runs this one.
  # ===========================================================================

  hooks:pre-push:
    desc: Full verification before pushing
    cmds:
      - task: check

  # ===========================================================================
  # Housekeeping
  # ===========================================================================

  clean:
    desc: Remove generated output
    cmds:
      - rm -rf {{.SITE}}
      - rm -rf dist .cache
      - rm -rf {{.TOOLS_DIR}}/node_modules
