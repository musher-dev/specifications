specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
  contract:
    inputs:
      databaseURL:
        schema:
          type: string
        description: Connection string of the database the application stores its data in.
        sensitive: true
        target:
          envVarKey: DATABASE_URL
    outputs: {}
