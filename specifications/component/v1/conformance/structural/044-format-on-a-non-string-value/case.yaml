specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      retries:
        description: Number of times a failed request is retried.
        schema:
          type: number
        presentationHint: URI
        target:
          envVarKey: RETRIES
    outputs: {}
