specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
      console:
        containerPort: 8081
        protocol: HTTP
    health:
      readiness:
        path: /healthz
        endpoint: api
        type: HTTP
  contract:
    inputs:
      consoleUrl:
        description: Public URL the admin console is served at.
        schema:
          type: string
        target:
          envVarKey: CONSOLE_URL
    outputs: {}
