specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      backend:
        schema:
          type: STRING
          enum:
            - S3
            - AZURE
        description: Object store the database ships its write-ahead log to.
    outputs: {}
