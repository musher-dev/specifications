specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    batch:
      componentRef: ./components/batch.yaml
      size: general.standard.small
      bindings:
        apiKey:
          type: PARAMETER
          parameter: apiKey
      exposure: {}
      volumes: {}
    models:
      componentRef: ./components/models.yaml
      size: null
      bindings:
        apiKey:
          type: PARAMETER
          parameter: apiKey
        baseUrl:
          type: PARAMETER
          parameter: baseUrl
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        apiKey:
          type: OUTPUT
          node: models
          output: apiKey
      exposure: {}
      volumes: {}
  parameters:
    apiKey:
      ui:
        label: API key
    baseUrl:
      ui:
        label: API base URL
