specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      db:
        containerPort: 5432
        protocol: TCP
        visibility: PUBLIC
  contract:
    inputs:
      databaseUrl:
        schema:
          type: STRING
        description: Connection URL clients outside the item use to reach the database.
    outputs: {}
