# `$${{` is a single four-character escape token rendering a literal `${{`, so
# what follows it is text and names no namespace. Without the escape this would
# be CORE-REF-002.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    app:
      componentRef: ./components/app.yaml
      size: general.standard.small
      connections: {}
  parameters:
    brokerAddress:
      default: "$${{ not.areference }}"
      ui:
        label: Broker address
