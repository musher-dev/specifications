      db:
        description: Connection this node stands for
        connection:
          protocol: S3
    outputs:
      endpointURL:
        description: Forwarded endpointURL
        schema:
          type: string
        from:
          input: db
          member: endpointURL
      region:
        description: Forwarded region
        schema:
          type: string
        from:
          input: db
          member: region
      bucket:
        description: Forwarded bucket
        schema:
          type: string
        from:
          input: db
          member: bucket
      accessKeyID:
        description: Forwarded accessKeyID
        schema:
          type: string
        from:
          input: db
          member: accessKeyID
      secretAccessKey:
        description: Forwarded secretAccessKey
        schema:
          type: string
        sensitive: true
        from:
          input: db
          member: secretAccessKey
