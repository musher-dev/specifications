# Keeps the supply chain of the non-normative tooling fresh. Nothing here
# touches the specification itself.
#
# - devcontainers  : bumps Features in devcontainer.json AND refreshes
#                    .devcontainer/devcontainer-lock.json (digest pins).
# - github-actions : bumps the actions pinned in .github/workflows/ and in the
#                    composite actions under .github/actions/.
# - bun            : bumps tools/ dependencies.
#
# Every `prefix` below is a Conventional Commits TYPE, optionally with a scope
# appended by `include: 'scope'` -- Dependabot emits the prefix as the type, so
# a value that is only a valid scope produces a message no gate will accept.
# `task check:commits` holds these against .config/commits/committed.toml;
# it was added because `prefix: 'devcontainer'` sat here wrong for months.
#
# `build`, `ci` and `chore` are all hidden in .github/release-please/config.json,
# so no dependency bump can cut a specification release.
#
# Every version update runs monthly, waits a week after a release (cooldown)
# and groups every dependency, so each entry opens at most one pull request a
# month (engineering-conventions DEPS-17); security updates ignore the schedule
# and arrive in a group of their own as soon as an advisory does.
#
# See docs/adr/0016-dependency-update-policy.md.
version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      devcontainers-all:
        patterns: ['*']
      devcontainers-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: 'build'
      include: 'scope' # -> build(deps): bump ...

  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows/ only; a composite action is found only in
    # the directory named for it.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: 'ci'
      include: 'scope' # -> ci(deps): bump ...

  - package-ecosystem: 'bun'
    directory: '/tools'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
      include: 'scope' # -> build(deps-dev): bump ...
    groups:
      tooling:
        patterns:
          - '*'
        # wrangler is the only dependency in this repository handed a
        # credential, and docs/governance.md -> Tooling dependencies rests its
        # guarantee on that pin moving only through a diff someone opened
        # deliberately. Inside the group it would arrive folded into somebody
        # else's lockfile churn, so it is kept out and reviewed on its own. A
        # maintainer may still bump it in a larger pull request that names the
        # bump in its description (docs/governance.md).
        exclude-patterns:
          - 'wrangler'
      # wrangler's security fixes stay out for the same reason, and arrive in
      # a pull request of their own.
      tooling-security:
        applies-to: security-updates
        patterns:
          - '*'
        exclude-patterns:
          - 'wrangler'
