specVersion: v2
kind: BLUEPRINT
metadata:
  slug: app
  revision: 1
  description: Synthetic conformance fixture blueprint.
spec:
  parameters:
    ownerPassword: { generator: { byteLength: 24, encoding: BASE64URL }, ui: { label: Owner password } }
    ownerPasswordHash: { hash: { parameter: ownerPassword, algorithm: BCRYPT } }
    codeHash: { hash: { parameter: ownerPassword, algorithm: ARGON2ID } }
    ownerEmail: { from: "${{ deployment.creator.email }}" }
  nodes:
    web:
      componentRef: ./components/web.yaml
      compute:
        profile: general.standard.small
      exposure:
        web: { visibility: PUBLIC, access: RESTRICTED, viewerIdentity: HEADER, viewerClaims: [EMAIL, NAME], accessExemptions: [PATHS, BEARER] }
        api: { visibility: PUBLIC, access: RESTRICTED, viewerIdentity: ASSERTION, viewerClaims: [EMAIL] }
        app: { visibility: PUBLIC, access: RESTRICTED, viewerIdentity: OIDC }
        hooks: { visibility: PUBLIC, access: RESTRICTED, accessExemptions: [PATHS] }
