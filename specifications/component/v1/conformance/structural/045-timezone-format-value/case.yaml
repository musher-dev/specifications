specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: n8nio/n8n:2.31.6
    endpoints:
      web:
        containerPort: 5678
        protocol: HTTP
  contract:
    inputs:
      timezone:
        description: Time zone the scheduler evaluates times in.
        schema:
          type: string
        required: false
        target:
          envVarKey: GENERIC_TIMEZONE
        default: UTC
        presentationHint: TIMEZONE
    outputs: {}
