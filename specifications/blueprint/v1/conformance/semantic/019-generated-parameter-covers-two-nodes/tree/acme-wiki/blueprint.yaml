specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      bindings:
        adminPassword:
          type: PARAMETER
          parameter: adminPassword
      exposure:
        primary: PRIVATE
      volumes: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      bindings:
        adminPassword:
          type: PARAMETER
          parameter: adminPassword
      exposure:
        primary: PRIVATE
      volumes: {}
  parameters:
    adminPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
      ui:
        label: Administrator password
