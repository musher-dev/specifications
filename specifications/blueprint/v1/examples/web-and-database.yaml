# yaml-language-server: $schema=https://specifications.musher.dev/blueprint/v1/blueprint.schema.json
#
# Two components wired together. Connections are consumer-anchored: the `web`
# node declares what it consumes and from which role, so a component never
# needs to know who will depend on it.
#
# The two nodes show that a repo-local reference does not mandate a directory
# layout — `db` names a document under `components/`, `web` a flat sibling.
#
# They also size independently. Compute is chosen per node rather than baked
# into the component, so the database gets more of it than the web server
# without either document changing.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.medium
      # Optional pins narrowing which host may run this node. They never change
      # the compute `size` names — this asks for the profile's vCPU on a host
      # that dedicates it, not for more of it.
      placement:
        cpuDedication: dedicated
      connections: {}
    web:
      componentRef: ./component-web-server.yaml
      size: general.standard.small
      connections:
        databaseUrl:
          fromRole: db
          fromOutput: connectionString
  # `parameters` is the install form, and it is always authored. Binding is by
  # key and the key is the whole of the correspondence: a parameter names no node
  # and no target, so `siteTitle` here supplies the `siteTitle` input of every
  # component that declares one and no connection fills, which is what lets one
  # parameter serve two components.
  #
  # A parameter carries presentation and supply, never the value's shape. Type,
  # enum, default, sensitivity and the help text all come from the inputs it
  # covers. `databaseUrl` arrives over the wire above, so no field asks for it,
  # and the database password is minted by the platform rather than typed.
  parameters:
    postgresPassword:
      generator:
        byteLength: 32
        encoding: BASE64URL
      ui:
        label: Database password
    siteTitle:
      ui:
        label: Site title
    telemetry:
      ui:
        label: Telemetry to export
        prominence: SECONDARY
        enumLabels:
          logs: Logs
          metrics: Metrics
          traces: Traces
