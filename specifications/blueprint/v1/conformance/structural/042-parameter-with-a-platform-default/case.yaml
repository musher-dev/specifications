specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      bindings:
        publicUrl:
          type: PARAMETER
          parameter: publicUrl
  parameters:
    publicUrl:
      platformDefault:
        type: SELF_ADDRESS
        source: PUBLIC_URL
      ui:
        label: Public URL
