# Vale configuration: lints the prose a reader of specifications.musher.dev
# reads (COPY-01..COPY-04 in musher-dev/engineering-conventions). It sits in
# the prose concern, not markdown/: Vale judges prose, whatever file holds it
# (CONF-15, docs/adr/0042).
# Read by: vale, via an explicit --config path (`task check:prose`), and by
# `conventions prose`. Never auto-discovered.
# Docs: https://vale.sh/docs/topics/config
#
# StylesPath is relative to this file, so the styles directory moves with it.
# `vale sync` downloads the packages below into it, and .gitignore ignores
# everything there except MusherSpecifications/, this repository's own style,
# which `task docs` generates from docs/terminology.yaml.
StylesPath = styles
# Warnings and errors. A suggestion, such as Microsoft.Wordiness or
# Google.ExcessiveClaims, is shown only with --minAlertLevel=suggestion.
MinAlertLevel = warning

# The MusherProse release equals the github:musher-dev/engineering-conventions
# pin in .config/mise/config.toml (COPY-02): raise both in one change.
Packages = https://github.com/musher-dev/engineering-conventions/releases/download/v0.9.3/MusherProse.zip

# The prose a reader reads: the v2 specifications, the guides under docs/, and
# every README. Decision records and the two migration histories
# (docs/downstream-v1-adoption.md, docs/pre-release-migration.md) are history
# that must spell the vocabulary it retired, release-please writes the
# CHANGELOGs, and `task docs` generates the traceability matrix and the
# glossary, which lists the very terms MusherSpecifications flags, so the last
# section turns the styles off for all of them.
[{README.md,**/README.md,docs/**.md,specifications/**/v2/*.md}]
BasedOnStyles = MusherCopy, proselint, write-good, MusherSpecifications
# "There is" and a sentence opening "So" are often the plainest way to state a
# rule or a consequence, and they are most of what write-good reports here.
write-good.ThereIs = NO
write-good.So = NO

# "Guarantee" is normative vocabulary in a specification: it states what an
# implementation must provide, not a marketing claim.
[specifications/**/v2/*.md]
Google.ExcessiveClaims = NO

[{docs/adr/**,**/CHANGELOG.md,docs/traceability.md,docs/terminology.md,docs/downstream-v1-adoption.md,docs/pre-release-migration.md}]
BasedOnStyles =
