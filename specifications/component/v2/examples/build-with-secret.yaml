specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: API service in one directory of a monorepo, whose build installs packages from a private registry with a build secret.
spec:
  type: SERVICE
  workload:
    source:
      git:
        repositoryURL: https://github.com/musher-dev/examples
        ref:
          branch: main
    build:
      context: services/api
      dockerfile: Dockerfile
      arguments:
        NODE_ENV: production
      secrets:
        NPM_TOKEN:
          input: npmToken
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs:
      npmToken:
        description: Token the build presents to the private package registry. It reaches the build only, never the running workload.
        schema:
          type: string
        sensitive: true
