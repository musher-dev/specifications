specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
  contract:
    inputs:
      databaseUrl:
        schema:
          type: string
        required: false
        description: Connection string of the database the application stores its data in.
        sensitive: true
        presentationHint: CONNECTION_STRING
        target:
          envVarKey: DATABASE_URL
    outputs: {}
