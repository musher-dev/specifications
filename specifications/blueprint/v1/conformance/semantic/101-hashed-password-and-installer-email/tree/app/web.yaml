specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: example/web:1
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs:
      ownerPasswordHash:
        description: Synthetic input.
        schema: { type: string }
        sensitive: true
        target: { envVarKey: OWNER_PASSWORD_HASH }
      ownerEmail:
        description: Synthetic input.
        schema: { type: string }
        target: { envVarKey: OWNER_EMAIL }
      ownerName:
        description: Synthetic input.
        schema: { type: string }
        target: { envVarKey: OWNER_NAME }
      ownerIdentity:
        description: Synthetic input.
        schema: { type: string }
        target: { envVarKey: OWNER_ID }
    outputs: {}
