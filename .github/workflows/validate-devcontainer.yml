name: Validate Dev Container

# Builds the dev container (DEVC-10), which takes minutes, so it runs only for a
# change that can affect the build. It is not a required check, which is why it
# may filter on `paths:`. ShellCheck of the dev container scripts is not here:
# Validate's Tools / Lint job runs it on every pull request (`task check:shell`).

on:
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.config/mise/**', '.github/workflows/validate-devcontainer.yml']
  pull_request:
    branches: [main]
    paths: ['.devcontainer/**', '.config/mise/**', '.github/workflows/validate-devcontainer.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    name: Feature Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --frozen-lockfile fails if devcontainer-lock.json is missing or if its
      # resolved Feature digests drift from devcontainer.json. The CLI is pinned
      # to an exact release, because a bare package name runs whatever npm
      # resolves as newest on the day of the run.
      - name: Enforce devcontainer-lock.json is current
        run: npx -y @devcontainers/cli@0.89.0 build --workspace-folder . --frozen-lockfile
