specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Web application built from its Git repository with a Dockerfile.
spec:
  type: SERVICE
  workload:
    source:
      git:
        repositoryURL: https://github.com/musher-dev/examples
        ref:
          branch: main
        build:
          dockerfile: Dockerfile
          arguments:
            NODE_ENV: production
    command:
      - node
      - server.js
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
        periodSeconds: 10
        failureThreshold: 3
