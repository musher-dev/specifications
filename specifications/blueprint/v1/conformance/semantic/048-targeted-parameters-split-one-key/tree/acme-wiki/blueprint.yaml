specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    payments:
      componentRef: ./components/payments.yaml
      size: general.standard.small
      bindings:
        apiKey:
          type: PARAMETER
          parameter: stripeKey
      exposure: {}
      volumes: {}
    mailer:
      componentRef: ./components/mailer.yaml
      size: general.standard.small
      bindings:
        apiKey:
          type: PARAMETER
          parameter: sendgridKey
      exposure: {}
      volumes: {}
  parameters:
    stripeKey:
      ui:
        label: Stripe API key
    sendgridKey:
      ui:
        label: SendGrid API key
