# The regression pin for listing §3.1: an item with no blueprint has an item
# root all the same, the directory holding this document. The slug is measured
# against it, `itemType: COMPONENT` is checked against what it holds (no
# blueprint, and exactly one component document), and `media/icon.png`
# resolves inside it. A validator that anchored the item root on
# `blueprint.yaml` finds none here and reports something.
specVersion: v2
kind: LISTING
metadata:
  slug: pgvector
spec:
  itemType: COMPONENT
  displayName: pgvector
  summary: Vector similarity search for PostgreSQL
  category: DATABASES
  lifecycleStage: STABLE
  icon: media/icon.png
