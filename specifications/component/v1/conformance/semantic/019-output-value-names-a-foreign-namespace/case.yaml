specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: Synthetic conformance fixture component.
spec:
  type: SERVICE
  workload:
    source:
      image: nginx:1.29.4-alpine
    endpoints:
      web:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: web
          path: /healthz
  contract:
    inputs: {}
    outputs:
      baseURL:
        description: Address this service answers on.
        schema:
          type: string
        from:
          template: "${{ variables.baseURL }}"
