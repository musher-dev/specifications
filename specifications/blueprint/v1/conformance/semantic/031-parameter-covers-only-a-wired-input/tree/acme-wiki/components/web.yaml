specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      databaseUrl:
        schema:
          type: STRING
          sensitive: true
        description: Connection string of the database the application stores its data in.
      adminPassword:
        schema:
          type: STRING
          sensitive: true
        description: Password of the administrator account the component creates on first start.
    outputs: {}
