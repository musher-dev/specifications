specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
  description: RabbitMQ message broker with an AMQP listener, a management console and HTTP API, and a Prometheus metrics endpoint.
spec:
  type: SERVICE
  workload:
    source:
      image: rabbitmq:4.1.4-management-alpine
    endpoints:
      amqp:
        targetPort: 5672
        protocol: TCP
      console:
        targetPort: 15672
        protocol: HTTP
      metrics:
        targetPort: 15692
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: metrics
          path: /metrics
    volumes:
      data:
        mountPath: /var/lib/rabbitmq
        minSizeGiB: 5
  contract:
    inputs:
      username:
        description: Name of the user the broker creates on first start.
        schema:
          type: string
          minLength: 1
        default: app
        target:
          envVarKey: RABBITMQ_DEFAULT_USER
      password:
        description: Password of the user the broker creates on first start.
        schema:
          type: string
          minLength: 12
        sensitive: true
        target:
          envVarKey: RABBITMQ_DEFAULT_PASS
    outputs:
      consoleUrl:
        description: Public URL of the management console, for an operator to sign in at.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        from:
          endpoint: console
          property: publicUrl
      apiUrl:
        description: Base URL of the management HTTP API, for sibling nodes that declare queues.
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        from:
          template: "http://${{ self.endpoints.console.privateAddress }}/api"
      wireAddress:
        description: Internal host and port of the AMQP listener, for sibling nodes that publish or consume.
        schema:
          type: string
        from:
          endpoint: amqp
          property: privateAddress
      username:
        description: Name of the broker user a client authenticates as.
        schema:
          type: string
          minLength: 1
        from:
          input: username
      password:
        description: Password of the broker user a client authenticates as.
        schema:
          type: string
          minLength: 12
        sensitive: true
        from:
          input: password
